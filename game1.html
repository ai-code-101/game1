<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Ball Pool - Professional HTML5</title>
    <style>
        :root {
            --bg: #1a0a00;
            --panel-bg: rgba(18, 8, 0, 0.96);
            --gold: #c8a45c;
            --gold-light: #e0c878;
            --text: #e8dcc8;
            --accent: #d4a030;
            --felt: #1a6b3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a04;
            background-image: radial-gradient(ellipse at center, #1a1a0c 0%, #0a0a02 60%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            border-radius: 10px;
            box-shadow: 0 0 70px rgba(180, 130, 40, 0.3), 0 0 180px rgba(0, 0, 0, 0.75),
                0 16px 50px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
            background: #000;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 28px 32px;
            text-align: center;
            color: var(--text);
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.85), 0 0 35px rgba(200, 150, 50, 0.25);
            z-index: 20;
            min-width: 260px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.35s ease, transform 0.35s ease, pointer-events 0s;
            pointer-events: auto;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none !important;
            transform: translate(-50%, -50%) scale(0.88);
        }
        .overlay h1 {
            font-size: 2em;
            color: var(--gold-light);
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(200, 150, 50, 0.5);
        }
        .overlay h2 {
            font-size: 1.3em;
            color: #fff;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }
        .overlay button {
            display: inline-block;
            margin: 7px 5px;
            padding: 11px 26px;
            font-size: 0.95em;
            font-weight: 600;
            letter-spacing: 0.8px;
            border: 2px solid var(--gold);
            background: linear-gradient(180deg, rgba(170, 120, 35, 0.35) 0%, rgba(90, 50, 15, 0.45) 100%);
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            white-space: nowrap;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay button:hover {
            background: linear-gradient(180deg, rgba(210, 160, 55, 0.55) 0%, rgba(130, 80, 25, 0.55) 100%);
            border-color: var(--gold-light);
            box-shadow: 0 0 22px rgba(200, 150, 50, 0.45);
            transform: translateY(-2px);
        }
        .overlay button:active {
            transform: scale(0.94);
            transition: transform 0.08s;
        }
        .overlay button.accent {
            background: linear-gradient(180deg, rgba(190, 135, 25, 0.65) 0%, rgba(130, 75, 15, 0.65) 100%);
            border-color: #e0b840;
        }
        .overlay button.small {
            padding: 7px 16px;
            font-size: 0.8em;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 9px 0;
            gap: 12px;
            font-size: 0.88em;
        }
        .setting-row label {
            color: #c8b898;
            white-space: nowrap;
        }
        .setting-row select {
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #5a4a30;
            background: #1a1008;
            color: #d8c8a8;
            font-size: 0.88em;
            cursor: pointer;
            min-width: 110px;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #3a2a15;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #5a4a30;
        }
        .toggle-slider:before {
            content: '';
            position: absolute;
            height: 18px;
            width: 18px;
            left: 2px;
            top: 2px;
            background: #8a7a5a;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked+.toggle-slider {
            background: #4a8a3a;
            border-color: #5a9a4a;
        }
        input:checked+.toggle-slider:before {
            transform: translateX(20px);
            background: #b8d8a0;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 8;
            pointer-events: none;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hud-item {
            background: rgba(8, 4, 0, 0.82);
            border: 1px solid rgba(180, 140, 80, 0.5);
            border-radius: 18px;
            padding: 5px 14px;
            color: #e8d8b8;
            font-size: 0.78em;
            font-weight: 600;
            letter-spacing: 0.4px;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
        }
        .hud-item.turn {
            border-color: #e0b840;
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: #e0b840;
                box-shadow: 0 0 6px rgba(200, 150, 40, 0.3);
            }
            50% {
                border-color: #ffd060;
                box-shadow: 0 0 16px rgba(240, 190, 60, 0.6);
            }
        }
        .hud-item.player1 {
            border-left: 3px solid #4a90d9;
        }
        .hud-item.player2 {
            border-left: 3px solid #d94a4a;
        }

        #power-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            z-index: 8;
            pointer-events: none;
        }
        .power-label {
            color: #c8b898;
            font-size: 0.65em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .power-bar-outer {
            width: 8px;
            height: 100px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(180, 140, 80, 0.45);
            border-radius: 5px;
            overflow: hidden;
        }
        .power-bar-inner {
            width: 100%;
            background: linear-gradient(to top, #4a4, #fa0, #f44);
            border-radius: 4px;
            transition: height 0.04s linear;
            position: absolute;
            bottom: 0;
        }

        @media (max-width: 600px) {
            .overlay {
                padding: 18px 20px;
                min-width: 220px;
                border-radius: 12px;
            }
            .overlay h1 {
                font-size: 1.4em;
            }
            .overlay h2 {
                font-size: 1em;
            }
            .overlay button {
                padding: 9px 18px;
                font-size: 0.8em;
                margin: 5px 3px;
            }
            #hud {
                top: 3px;
                gap: 5px;
            }
            .hud-item {
                padding: 3px 8px;
                font-size: 0.68em;
                border-radius: 14px;
            }
            #power-indicator {
                bottom: 10px;
                right: 8px;
            }
            .power-bar-outer {
                width: 6px;
                height: 65px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="poolCanvas"></canvas>

        <div id="hud">
            <span class="hud-item player1" id="hudP1">🎱 P1: 0</span>
            <span class="hud-item turn" id="hudTurn">▶ Player 1</span>
            <span class="hud-item player2" id="hudP2">P2: 0 🔴</span>
            <span class="hud-item" id="hudFoul" style="display:none;color:#f88;">⚠ Foul</span>
        </div>

        <div id="power-indicator">
            <span class="power-label">Power</span>
            <div class="power-bar-outer"><div class="power-bar-inner" id="powerBarFill" style="height:0%;"></div></div>
        </div>

        <div class="overlay" id="mainMenu">
            <h1>🎱 8-BALL POOL</h1>
            <p style="color:#c8a45c;margin-bottom:14px;">Professional Edition</p>
            <button class="accent" id="btnPractice">🏋️ Practice</button>
            <button id="btnPvP">👥 Player vs Player</button>
            <button id="btnAI">🤖 vs AI</button>
            <button class="small" id="btnSettings">⚙️ Settings</button>
        </div>

        <div class="overlay hidden" id="settingsMenu">
            <h2>⚙️ Settings</h2>
            <div class="setting-row"><label>AI Difficulty</label>
                <select id="aiDifficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
            <div class="setting-row"><label>Sound FX</label>
                <label class="toggle-switch"><input type="checkbox" id="soundToggle" checked><span class="toggle-slider"></span></label></div>
            <div class="setting-row"><label>Music</label>
                <label class="toggle-switch"><input type="checkbox" id="musicToggle"><span class="toggle-slider"></span></label></div>
            <div class="setting-row"><label>Guide Line</label>
                <label class="toggle-switch"><input type="checkbox" id="guideToggle" checked><span class="toggle-slider"></span></label></div>
            <div class="setting-row"><label>Table Theme</label>
                <select id="tableTheme"><option value="classic">Classic Green</option><option value="blue">Tournament Blue</option><option value="red">Burgundy</option></select></div>
            <br>
            <button id="btnSettingsBack">← Back</button>
        </div>

        <div class="overlay hidden" id="pauseMenu">
            <h2>⏸️ Paused</h2>
            <button id="btnResume">▶ Resume</button>
            <button id="btnRestart">🔄 Restart</button>
            <button id="btnQuit" style="border-color:#c0392b;color:#e88;">🚪 Quit</button>
        </div>

        <div class="overlay hidden" id="gameOverMenu">
            <h2 id="gameOverTitle">🏆 Game Over</h2>
            <p id="gameOverMsg" style="font-size:1.05em;color:#e0c878;"></p>
            <button class="accent" id="btnPlayAgain">🔄 Play Again</button>
            <button id="btnGoMenu">🏠 Main Menu</button>
        </div>
    </div>

    <script>
        (function() {
            // ──────────────────────────────────────
            // DOM refs
            // ──────────────────────────────────────
            const canvas = document.getElementById('poolCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('game-container');

            // ──────────────────────────────────────
            // Constants
            // ──────────────────────────────────────
            const TABLE_W = 800;
            const TABLE_H = 400;
            const RAIL_W = 42;
            const BALL_R = 13;
            const POCKET_R = 22;
            const CORNER_POCKET_R = 24;
            const FRICTION = 0.985;
            const CUSHION_REST = 0.7;
            const BALL_REST = 0.92;
            const MAX_POWER = 22;
            const MIN_POWER = 1.5;
            const POCKET_PULL = 28;

            // ──────────────────────────────────────
            // Audio – procedural Web Audio
            // ──────────────────────────────────────
            class AudioManager {
                constructor() {
                    this.enabled = true;
                    this.musicOn = false;
                    this.ctx = null;
                    this.musicTimer = null;
                    try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) { this
                            .enabled = false; }
                }
                play(freq, type, dur, vol = 0.14, decay = true) {
                    if (!this.enabled || !this.ctx) return;
                    try {
                        const t = this.ctx.currentTime;
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = type;
                        o.frequency.setValueAtTime(freq, t);
                        g.gain.setValueAtTime(vol, t);
                        if (decay) g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                        else g.gain.setValueAtTime(vol, t + dur);
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        o.start(t);
                        o.stop(t + dur);
                    } catch (e) {}
                }
                cueStrike(pow) {
                    const v = 0.1 + pow / MAX_POWER * 0.18;
                    this.play(200, 'square', 0.07, v);
                    setTimeout(() => this.play(55, 'triangle', 0.14, v * 0.65), 25);
                }
                ballHit(f) { this.play(280 + f * 35, 'sine', 0.05, Math.min(0.16, f * 0.025)); }
                pocket() { this.play(70, 'triangle', 0.28, 0.18);
                    setTimeout(() => this.play(38, 'sine', 0.35, 0.14), 70); }
                cushion() { this.play(90, 'triangle', 0.05, 0.05); }
                foul() { this.play(48, 'sawtooth', 0.45, 0.14); }
                victory() { this.play(523, 'sine', 0.18, 0.16, false);
                    setTimeout(() => this.play(659, 'sine', 0.18, 0.16, false), 140);
                    setTimeout(() => this.play(784, 'sine', 0.28, 0.22, false), 280); }
                startMusic() {
                    if (!this.musicOn || !this.ctx || this.musicTimer) return;
                    const notes = [130.81, 146.83, 164.81, 174.61, 196, 220, 246.94, 261.63];
                    let i = 0;
                    const fn = () => { if (!this.musicOn) return;
                        this.play(notes[i % notes.length], 'sine', 0.9, 0.025, true);
                        i++; };
                    this.musicTimer = setInterval(fn, 1300);
                    fn();
                }
                stopMusic() { if (this.musicTimer) { clearInterval(this.musicTimer);
                        this.musicTimer = null; } }
                toggleSound() { this.enabled = !this.enabled; if (!this.enabled) this.stopMusic(); return this.enabled; }
                toggleMusic() { this.musicOn = !this.musicOn; if (this.musicOn) this.startMusic(); else this.stopMusic
                    (); return this.musicOn; }
            }

            // ──────────────────────────────────────
            // Vec2
            // ──────────────────────────────────────
            class Vec2 {
                constructor(x = 0, y = 0) { this.x = x;
                    this.y = y; }
                set(x, y) { this.x = x;
                    this.y = y; return this; }
                copy(v) { this.x = v.x;
                    this.y = v.y; return this; }
                clone() { return new Vec2(this.x, this.y); }
                add(v) { this.x += v.x;
                    this.y += v.y; return this; }
                sub(v) { this.x -= v.x;
                    this.y -= v.y; return this; }
                scale(s) { this.x *= s;
                    this.y *= s; return this; }
                dot(v) { return this.x * v.x + this.y * v.y; }
                len() { return Math.sqrt(this.x * this.x + this.y * this.y); }
                lenSq() { return this.x * this.x + this.y * this.y; }
                norm() { const l = this.len(); if (l > 1e-6) { this.x /= l;
                        this.y /= l; } return this; }
                dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
                angle() { return Math.atan2(this.y, this.x); }
                static fromAngle(a) { return new Vec2(Math.cos(a), Math.sin(a)); }
            }

            // ──────────────────────────────────────
            // Particle
            // ──────────────────────────────────────
            class Particle {
                constructor(x, y, vx, vy, color, life = 0.5, size = 3) {
                    this.pos = new Vec2(x, y);
                    this.vel = new Vec2(vx, vy);
                    this.color = color;
                    this.life = life;
                    this.maxLife = life;
                    this.size = size;
                    this.alive = true;
                }
                update(dt) {
                    this.life -= dt;
                    if (this.life <= 0) { this.alive = false; return; }
                    this.pos.add(this.vel.clone().scale(dt));
                    this.vel.scale(0.93);
                }
                draw(ctx, sc, ox, oy) {
                    const a = this.life / this.maxLife;
                    const sx = this.pos.x * sc + ox;
                    const sy = this.pos.y * sc + oy;
                    ctx.fillStyle = this.color.replace('1)', `${a})`).replace('rgb', 'rgba');
                    ctx.beginPath();
                    ctx.arc(sx, sy, this.size * sc * (0.3 + a * 0.7), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            class ParticleSystem {
                constructor() { this.particles = []; }
                emit(x, y, n, color, force = 3, life = 0.5, size = 3) {
                    for (let i = 0; i < n; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const s = Math.random() * force;
                        this.particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, color, life + Math.random() *
                            0.3, size + Math.random() * 2));
                    }
                }
                update(dt) { for (const p of this.particles) p.update(dt);
                    this.particles = this.particles.filter(p => p.alive); }
                draw(ctx, sc, ox, oy) { for (const p of this.particles) p.draw(ctx, sc, ox, oy); }
                clear() { this.particles = []; }
            }

            // ──────────────────────────────────────
            // Ball
            // ──────────────────────────────────────
            class Ball {
                constructor(x, y, num, isCue = false) {
                    this.pos = new Vec2(x, y);
                    this.vel = new Vec2(0, 0);
                    this.radius = BALL_R;
                    this.number = num;
                    this.isCue = isCue;
                    this.pocketed = false;
                    this.isSolid = num >= 1 && num <= 7;
                    this.isStripe = num >= 9 && num <= 15;
                    this.isEight = num === 8;
                    this.spin = 0;
                }
                get color() {
                    if (this.isCue) return '#fafaf5';
                    if (this.isEight) return '#111';
                    if (this.isSolid) return ['#f4d03f', '#2471a3', '#c0392b', '#2e4053', '#f39c12', '#1a5c2a',
                        '#8b1a1a'
                    ][this.number - 1] || '#888';
                    if (this.isStripe) return ['#f7dc6f', '#2e86c1', '#e74c3c', '#3d2b6b', '#f0b27a', '#27ae60',
                        '#b03a2e'
                    ][this.number - 9] || '#aaa';
                    return '#ccc';
                }
                get stripeColor() { return this.isStripe ? ['#fff', '#fff', '#fff', '#e8d8f0', '#fff', '#fff', '#fff'][this
                        .number - 9] || '#fff' : '#fff'; }
                update(dt) {
                    if (this.pocketed) return;
                    const ff = Math.pow(FRICTION, dt * 60);
                    this.vel.scale(ff);
                    if (this.vel.len() < 0.06) this.vel.set(0, 0);
                    this.pos.add(this.vel.clone().scale(dt));
                }
                draw(ctx, sc, ox, oy) {
                    if (this.pocketed) return;
                    const sx = this.pos.x * sc + ox;
                    const sy = this.pos.y * sc + oy;
                    const r = this.radius * sc;
                    // shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.beginPath();
                    ctx.arc(sx + r * 0.18, sy + r * 0.22, r, 0, Math.PI * 2);
                    ctx.fill();
                    // gradient body
                    const grad = ctx.createRadialGradient(sx - r * 0.3, sy - r * 0.35, r * 0.08, sx, sy, r);
                    if (this.isCue) {
                        grad.addColorStop(0, '#fff');
                        grad.addColorStop(0.45, '#f2f1eb');
                        grad.addColorStop(0.8, '#dcd9d2');
                        grad.addColorStop(1, '#b5b2aa');
                    } else if (this.isEight) {
                        grad.addColorStop(0, '#4a4a4a');
                        grad.addColorStop(0.4, '#1a1a1a');
                        grad.addColorStop(0.85, '#000');
                        grad.addColorStop(1, '#111');
                    } else if (this.isSolid) {
                        const c = this.color;
                        grad.addColorStop(0, this._light(c, 60));
                        grad.addColorStop(0.5, c);
                        grad.addColorStop(0.85, this._dark(c, 45));
                        grad.addColorStop(1, this._dark(c, 65));
                    } else if (this.isStripe) {
                        grad.addColorStop(0, '#fff');
                        grad.addColorStop(0.35, '#fafaf8');
                        grad.addColorStop(0.5, this.stripeColor);
                        grad.addColorStop(0.65, this.color);
                        grad.addColorStop(0.85, this._dark(this.color, 45));
                        grad.addColorStop(1, this._dark(this.color, 65));
                    }
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.fill();
                    // highlight
                    const hl = ctx.createRadialGradient(sx - r * 0.35, sy - r * 0.4, r * 0.04, sx - r * 0.08, sy - r * 0.12,
                        r * 1.15);
                    hl.addColorStop(0, 'rgba(255,255,255,0.75)');
                    hl.addColorStop(0.35, 'rgba(255,255,255,0.2)');
                    hl.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = hl;
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.fill();
                    // number
                    if (this.number > 0 && !this.isCue) {
                        const nr = r * 0.44;
                        ctx.fillStyle = 'rgba(255,255,255,0.92)';
                        ctx.beginPath();
                        ctx.arc(sx, sy, nr, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#111';
                        ctx.font = `bold ${r*0.72}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(this.number, sx, sy + r * 0.03);
                    }
                    // outline
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = r * 0.04;
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
                _light(hex, p) {
                    const n = parseInt(hex.replace('#', ''), 16);
                    const r = Math.min(255, (n >> 16) + p);
                    const g = Math.min(255, ((n >> 8) & 0xFF) + p);
                    const b = Math.min(255, (n & 0xFF) + p);
                    return `rgb(${r},${g},${b})`;
                }
                _dark(hex, p) {
                    const n = parseInt(hex.replace('#', ''), 16);
                    const r = Math.max(0, (n >> 16) - p);
                    const g = Math.max(0, ((n >> 8) & 0xFF) - p);
                    const b = Math.max(0, (n & 0xFF) - p);
                    return `rgb(${r},${g},${b})`;
                }
            }

            // ──────────────────────────────────────
            // Table
            // ──────────────────────────────────────
            class Table {
                constructor() {
                    this.w = TABLE_W;
                    this.h = TABLE_H;
                    this.rail = RAIL_W;
                    this.pockets = this._pockets();
                    this.cushions = this._cushions();
                    this.theme = 'classic';
                }
                _pockets() {
                    const hw = this.w / 2,
                        hh = this.h / 2;
                    return [
                        { pos: new Vec2(-hw, -hh), r: CORNER_POCKET_R, id: 'tl' },
                        { pos: new Vec2(0, -hh - 2), r: POCKET_R, id: 'tc' },
                        { pos: new Vec2(hw, -hh), r: CORNER_POCKET_R, id: 'tr' },
                        { pos: new Vec2(-hw, hh), r: CORNER_POCKET_R, id: 'bl' },
                        { pos: new Vec2(0, hh + 2), r: POCKET_R, id: 'bc' },
                        { pos: new Vec2(hw, hh), r: CORNER_POCKET_R, id: 'br' },
                    ];
                }
                _cushions() {
                    const hw = this.w / 2,
                        hh = this.h / 2,
                        cr = CORNER_POCKET_R,
                        sr = POCKET_R;
                    return [
                        { s: new Vec2(-hw + cr * 1.3, -hh), e: new Vec2(-sr * 0.9, -hh), n: new Vec2(0, 1) },
                        { s: new Vec2(sr * 0.9, -hh), e: new Vec2(hw - cr * 1.3, -hh), n: new Vec2(0, 1) },
                        { s: new Vec2(-hw + cr * 1.3, hh), e: new Vec2(-sr * 0.9, hh), n: new Vec2(0, -1) },
                        { s: new Vec2(sr * 0.9, hh), e: new Vec2(hw - cr * 1.3, hh), n: new Vec2(0, -1) },
                        { s: new Vec2(-hw, -hh + cr * 1.3), e: new Vec2(-hw, -sr * 0.9), n: new Vec2(1, 0) },
                        { s: new Vec2(-hw, sr * 0.9), e: new Vec2(-hw, hh - cr * 1.3), n: new Vec2(1, 0) },
                        { s: new Vec2(hw, -hh + cr * 1.3), e: new Vec2(hw, -sr * 0.9), n: new Vec2(-1, 0) },
                        { s: new Vec2(hw, sr * 0.9), e: new Vec2(hw, hh - cr * 1.3), n: new Vec2(-1, 0) },
                    ];
                }
                feltColor() { return this.theme === 'blue' ? '#1a5c3a' : this.theme === 'red' ? '#5c1a2a' : '#1a6b3c'; }
                feltDark() { return this.theme === 'blue' ? '#0d3a22' : this.theme === 'red' ? '#3a0d18' : '#0d4a25'; }
                draw(ctx, sc, ox, oy) {
                    const tw = (this.w + this.rail * 2) * sc;
                    const th = (this.h + this.rail * 2) * sc;
                    const tx = ox - this.rail * sc;
                    const ty = oy - this.rail * sc;
                    // outer shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(tx + 5, ty + 5, tw, th);
                    // wood
                    const wg = ctx.createLinearGradient(tx, ty, tx + tw, ty + th);
                    wg.addColorStop(0, '#7a4a2a');
                    wg.addColorStop(0.3, '#9a6a3a');
                    wg.addColorStop(0.5, '#b0804a');
                    wg.addColorStop(0.7, '#8a5a30');
                    wg.addColorStop(1, '#5a3020');
                    ctx.fillStyle = wg;
                    ctx.fillRect(tx, ty, tw, th);
                    // inner rail
                    const ix = tx + this.rail * sc * 0.5;
                    const iy = ty + this.rail * sc * 0.5;
                    const iw = tw - this.rail * sc;
                    const ih = th - this.rail * sc;
                    const ig = ctx.createLinearGradient(ix, iy, ix + iw, iy + ih);
                    ig.addColorStop(0, '#3a1a08');
                    ig.addColorStop(0.5, '#5a3020');
                    ig.addColorStop(1, '#2a1005');
                    ctx.fillStyle = ig;
                    ctx.fillRect(ix, iy, iw, ih);
                    // felt
                    const fx = ox - this.w / 2 * sc;
                    const fy = oy - this.h / 2 * sc;
                    const fw = this.w * sc;
                    const fh = this.h * sc;
                    const fg = ctx.createRadialGradient(ox, oy, fw * 0.08, ox, oy, fw * 0.95);
                    fg.addColorStop(0, this.feltColor());
                    fg.addColorStop(1, this.feltDark());
                    ctx.fillStyle = fg;
                    ctx.fillRect(fx, fy, fw, fh);
                    // subtle lines
                    ctx.strokeStyle = 'rgba(255,255,255,0.012)';
                    ctx.lineWidth = 1;
                    for (let x = fx; x < fx + fw; x += 14 * sc) { ctx.beginPath();
                        ctx.moveTo(x, fy);
                        ctx.lineTo(x, fy + fh);
                        ctx.stroke(); }
                    // head string
                    const hsx = ox - this.w * 0.25 * sc;
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.setLineDash([5 * sc, 7 * sc]);
                    ctx.beginPath();
                    ctx.moveTo(hsx, fy);
                    ctx.lineTo(hsx, fy + fh);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    // foot spot
                    ctx.fillStyle = 'rgba(255,255,255,0.22)';
                    ctx.beginPath();
                    ctx.arc(ox + this.w * 0.25 * sc, oy, 2.5 * sc, 0, Math.PI * 2);
                    ctx.fill();
                    // pockets
                    for (const p of this.pockets) {
                        const px = p.pos.x * sc + ox;
                        const py = p.pos.y * sc + oy;
                        const pr = p.r * sc;
                        const pg = ctx.createRadialGradient(px, py, pr * 0.25, px, py, pr);
                        pg.addColorStop(0, '#000');
                        pg.addColorStop(0.7, '#111');
                        pg.addColorStop(1, '#1a1a1a');
                        ctx.fillStyle = pg;
                        ctx.beginPath();
                        ctx.arc(px, py, pr, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#3a2010';
                        ctx.lineWidth = 2 * sc;
                        ctx.beginPath();
                        ctx.arc(px, py, pr + 0.8 * sc, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    // diamonds
                    ctx.fillStyle = 'rgba(255,220,180,0.55)';
                    const ds = this.w / 8;
                    for (let i = 1; i < 8; i++) {
                        const dx = (-this.w / 2 + ds * i) * sc + ox;
                        ctx.beginPath();
                        ctx.arc(dx, (-this.h / 2 - this.rail * 0.55) * sc + oy, 3 * sc, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(dx, (this.h / 2 + this.rail * 0.55) * sc + oy, 3 * sc, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    const dsY = this.h / 4;
                    for (let i = 1; i < 4; i++) {
                        const dy = (-this.h / 2 + dsY * i) * sc + oy;
                        ctx.beginPath();
                        ctx.arc((-this.w / 2 - this.rail * 0.55) * sc + ox, dy, 3 * sc, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc((this.w / 2 + this.rail * 0.55) * sc + ox, dy, 3 * sc, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ──────────────────────────────────────
            // Cue stick (longer, more visible)
            // ──────────────────────────────────────
            class Cue {
                constructor() {
                    this.angle = Math.PI;
                    this.power = 0;
                    this.pullback = 0;
                    this.visible = true;
                    this.animating = false;
                    this.animT = 0;
                    this.animDur = 0.14;
                }
                draw(ctx, sc, ox, oy, cuePos) {
                    if (!this.visible || !cuePos) return;
                    const sx = cuePos.x * sc + ox;
                    const sy = cuePos.y * sc + oy;
                    const pull = this.pullback * sc;
                    // Longer base: BALL_R+30 = 43 units base length
                    const totalLen = (BALL_R + 30) * sc + pull;
                    const tipLen = (BALL_R + 4) * sc;

                    const startX = sx - Math.cos(this.angle) * totalLen;
                    const startY = sy - Math.sin(this.angle) * totalLen;
                    const endX = sx - Math.cos(this.angle) * tipLen;
                    const endY = sy - Math.sin(this.angle) * tipLen;

                    // shadow
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                    ctx.lineWidth = 8 * sc;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(startX + 3, startY + 3);
                    ctx.lineTo(endX + 3, endY + 3);
                    ctx.stroke();

                    // tapered body
                    const tipW = 3.5 * sc;
                    const buttW = 8.5 * sc;
                    const segs = 24;
                    for (let i = 0; i < segs; i++) {
                        const t = i / segs;
                        const tn = (i + 1) / segs;
                        const w = tipW + (buttW - tipW) * t;
                        const wn = tipW + (buttW - tipW) * tn;
                        const x1 = startX + (endX - startX) * t;
                        const y1 = startY + (endY - startY) * t;
                        const x2 = startX + (endX - startX) * tn;
                        const y2 = startY + (endY - startY) * tn;
                        const shade = 0.5 + t * 0.5;
                        ctx.fillStyle =
                            `rgb(${Math.floor(175*shade)},${Math.floor(135*shade)},${Math.floor(85*shade)})`;
                        ctx.beginPath();
                        ctx.moveTo(x1 - w / 2, y1);
                        ctx.lineTo(x1 + w / 2, y1);
                        ctx.lineTo(x2 + wn / 2, y2);
                        ctx.lineTo(x2 - wn / 2, y2);
                        ctx.closePath();
                        ctx.fill();
                    }
                    // ferrule
                    const fl = 14 * sc;
                    const fsx = endX - Math.cos(this.angle) * fl;
                    const fsy = endY - Math.sin(this.angle) * fl;
                    ctx.strokeStyle = '#f5f3ec';
                    ctx.lineWidth = 4.5 * sc;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(fsx, fsy);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                    // tip
                    ctx.fillStyle = '#3a8ad4';
                    ctx.beginPath();
                    ctx.arc(endX, endY, 3.5 * sc, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ──────────────────────────────────────
            // Physics
            // ──────────────────────────────────────
            class PhysicsEngine {
                constructor(table, audio, particles) {
                    this.table = table;
                    this.audio = audio;
                    this.parts = particles;
                }
                checkPocket(ball) {
                    if (ball.pocketed) return false;
                    for (const p of this.table.pockets) {
                        const d = ball.pos.dist(p.pos);
                        if (d < p.r - ball.radius * 0.3) {
                            ball.pocketed = true;
                            ball.vel.set(0, 0);
                            this.parts.emit(ball.pos.x, ball.pos.y, 22, 'rgb(255,220,150)', 4, 0.55, 3.5);
                            if (this.audio) this.audio.pocket();
                            return true;
                        }
                        if (d < p.r + POCKET_PULL && ball.vel.len() < 3) {
                            const dir = p.pos.clone().sub(ball.pos).norm();
                            ball.vel.add(dir.scale((1 - d / (p.r + POCKET_PULL)) * 0.7));
                        }
                    }
                    return false;
                }
                checkCushions(ball) {
                    if (ball.pocketed) return;
                    let hit = false;
                    for (const seg of this.table.cushions) {
                        const cp = this._closestPt(ball.pos, seg.s, seg.e);
                        const d = ball.pos.dist(cp);
                        if (d < ball.radius) {
                            const push = ball.pos.clone().sub(cp).norm();
                            if (push.len() < 1e-4) push.copy(seg.n);
                            ball.pos.copy(cp.clone().add(push.clone().scale(ball.radius + 0.4)));
                            const dot = ball.vel.dot(push);
                            if (dot < 0) {
                                ball.vel.sub(push.clone().scale(2 * dot));
                                ball.vel.scale(CUSHION_REST);
                                hit = true;
                            }
                        }
                    }
                    for (const p of this.table.pockets) {
                        const d = ball.pos.dist(p.pos);
                        const safe = p.r + ball.radius * 0.65;
                        if (d < safe && d > p.r - ball.radius * 0.4) {
                            const push = ball.pos.clone().sub(p.pos).norm();
                            if (push.len() > 1e-4) {
                                ball.pos.copy(p.pos.clone().add(push.clone().scale(safe)));
                                const dot = ball.vel.dot(push);
                                if (dot < 0) { ball.vel.sub(push.clone().scale(2 * dot));
                                    ball.vel.scale(CUSHION_REST * 0.8);
                                    hit = true; }
                            }
                        }
                    }
                    if (hit) {
                        if (this.audio) this.audio.cushion();
                        this.parts.emit(ball.pos.x, ball.pos.y, 5, 'rgb(200,180,150)', 1.4, 0.25, 1.8);
                    }
                }
                ballCollision(a, b) {
                    if (a.pocketed || b.pocketed) return;
                    const d = a.pos.dist(b.pos);
                    const minD = a.radius + b.radius;
                    if (d < minD && d > 0.0001) {
                        const overlap = minD - d;
                        const sep = a.pos.clone().sub(b.pos).norm();
                        if (sep.len() < 1e-4) sep.set(1, 0);
                        a.pos.add(sep.clone().scale(overlap / 2));
                        b.pos.sub(sep.clone().scale(overlap / 2));
                        const rv = a.vel.clone().sub(b.vel);
                        const cn = a.pos.clone().sub(b.pos).norm();
                        const rvd = rv.dot(cn);
                        if (rvd > 0) return;
                        const imp = cn.clone().scale(rvd * BALL_REST);
                        a.vel.sub(imp);
                        b.vel.add(imp);
                        if (a.spin !== 0) {
                            const tan = new Vec2(-cn.y, cn.x);
                            a.vel.add(tan.scale(a.spin * 0.25));
                        }
                        const force = Math.abs(rvd);
                        if (this.audio) this.audio.ballHit(force);
                        const mx = (a.pos.x + b.pos.x) / 2;
                        const my = (a.pos.y + b.pos.y) / 2;
                        this.parts.emit(mx, my, Math.floor(force * 2.5), 'rgb(255,240,220)', force * 0.45, 0.22, 2.5);
                    }
                }
                _closestPt(pt, s, e) {
                    const ab = e.clone().sub(s);
                    const ap = pt.clone().sub(s);
                    const l2 = ab.lenSq();
                    if (l2 < 1e-6) return s.clone();
                    let t = ap.dot(ab) / l2;
                    t = Math.max(0, Math.min(1, t));
                    return s.clone().add(ab.scale(t));
                }
                update(balls, dt) {
                    const steps = 3;
                    const sdt = dt / steps;
                    for (let st = 0; st < steps; st++) {
                        for (const b of balls) {
                            if (!b.pocketed) { b.update(sdt);
                                this.checkCushions(b);
                                this.checkPocket(b); }
                        }
                        for (let i = 0; i < balls.length; i++)
                            for (let j = i + 1; j < balls.length; j++) this.ballCollision(balls[i], balls[j]);
                    }
                }
                allStopped(balls) { return balls.every(b => b.pocketed || b.vel.len() < 0.05); }
            }

            // ──────────────────────────────────────
            // Game Manager
            // ──────────────────────────────────────
            class GameManager {
                constructor(audio) {
                    this.audio = audio;
                    this.table = new Table();
                    this.particles = new ParticleSystem();
                    this.physics = new PhysicsEngine(this.table, this.audio, this.particles);
                    this.cue = new Cue();
                    this.balls = [];
                    this.cueBall = null;
                    this.mode = 'practice';
                    this.aiDiff = 'medium';
                    this.curPlayer = 1;
                    this.p1Type = 'solid';
                    this.p2Type = 'stripe';
                    this.assigned = false;
                    this.gameOver = false;
                    this.winner = null;
                    this.paused = false;
                    this.aiming = false;
                    this.shotActive = false;
                    this.firstContact = null;
                    this.pocketedShot = [];
                    this.foulShot = false;
                    this.scores = { 1: 0, 2: 0 };
                    this.foulMsg = '';
                    this.foulTimer = 0;
                    this.shake = 0;
                    this.shakeX = 0;
                    this.shakeY = 0;
                    this.winCeleb = 0;
                    this.showGuide = true;
                }
                setupRack() {
                    this.balls = [];
                    this.particles.clear();
                    this.assigned = false;
                    this.gameOver = false;
                    this.winner = null;
                    this.shotActive = false;
                    this.pocketedShot = [];
                    this.foulShot = false;
                    this.firstContact = null;
                    this.foulMsg = '';
                    this.foulTimer = 0;
                    this.shake = 0;
                    this.winCeleb = 0;
                    this.scores = { 1: 0, 2: 0 };
                    const hw = this.table.w / 2;
                    const hh = this.table.h / 2;
                    this.cueBall = new Ball(-hw * 0.5, 0, 0, true);
                    this.balls.push(this.cueBall);
                    const sx = hw * 0.5;
                    const sy = 0;
                    const sp = BALL_R * 2 + 0.8;
                    const rack = [
                        { r: 0, c: 0, n: 1 }, { r: 1, c: 0, n: 9 }, { r: 1, c: 1, n: 2 },
                        { r: 2, c: 0, n: 3 }, { r: 2, c: 1, n: 8 }, { r: 2, c: 2, n: 10 },
                        { r: 3, c: 0, n: 11 }, { r: 3, c: 1, n: 4 }, { r: 3, c: 2, n: 12 }, { r: 3, c: 3, n: 5 },
                        { r: 4, c: 0, n: 13 }, { r: 4, c: 1, n: 6 }, { r: 4, c: 2, n: 14 }, { r: 4, c: 3, n: 7 },
                        { r: 4, c: 4, n: 15 },
                    ];
                    for (const rb of rack) {
                        const x = sx + rb.r * sp * Math.cos(Math.PI / 6);
                        const y = sy + (rb.c - rb.r / 2) * sp;
                        this.balls.push(new Ball(x, y, rb.n));
                    }
                    this.curPlayer = 1;
                    this.cue.visible = true;
                    this.cue.angle = Math.PI;
                    this.cue.power = 0;
                    this.cue.pullback = 0;
                }
                playerBalls(p) {
                    const t = p === 1 ? this.p1Type : this.p2Type;
                    return this.balls.filter(b => !b.pocketed && !b.isCue && !b.isEight && ((t === 'solid' && b
                        .isSolid) || (t === 'stripe' && b.isStripe)));
                }
                allPocketed(p) { return this.playerBalls(p).length === 0; }
                eightOnTable() { return this.balls.some(b => b.number === 8 && !b.pocketed); }
                handleShotResult() {
                    const psolids = this.pocketedShot.filter(b => b.isSolid);
                    const pstripes = this.pocketedShot.filter(b => b.isStripe);
                    const p8 = this.pocketedShot.find(b => b.isEight);
                    const pCue = this.pocketedShot.find(b => b.isCue);
                    let foul = this.foulShot;
                    let switchTurn = false;
                    if (pCue) {
                        foul = true;
                        this.foulMsg = 'Scratch! Ball in hand.';
                        this.foulTimer = 2.5;
                        if (this.audio) this.audio.foul();
                        this.cueBall.pocketed = false;
                        this.cueBall.vel.set(0, 0);
                        this.cueBall.pos.set(-this.table.w * 0.35, (Math.random() - 0.5) * this.table.h * 0.55);
                        switchTurn = true;
                    }
                    if (p8) {
                        if (!this.assigned) {
                            p8.pocketed = false;
                            p8.pos.set(this.table.w * 0.5, 0);
                            p8.vel.set(0, 0);
                            this.foulMsg = '8-ball on break - respotted';
                            this.foulTimer = 2;
                            switchTurn = true;
                        } else if (this.allPocketed(this.curPlayer) && !foul) {
                            this.gameOver = true;
                            this.winner = this.curPlayer;
                            if (this.audio) this.audio.victory();
                            this.winCeleb = 3;
                            this.cue.visible = false;
                            return;
                        } else {
                            this.gameOver = true;
                            this.winner = this.curPlayer === 1 ? 2 : 1;
                            this.foulMsg = '8-ball pocketed illegally!';
                            this.foulTimer = 3;
                            if (this.audio) this.audio.foul();
                            this.cue.visible = false;
                            return;
                        }
                    }
                    if (!this.assigned && (psolids.length > 0 || pstripes.length > 0) && !foul) {
                        if (psolids.length > 0 && pstripes.length === 0) { this.p1Type = 'solid';
                            this.p2Type = 'stripe';
                            this.assigned = true; } else if (pstripes.length > 0 && psolids.length === 0) { this
                                .p1Type = 'stripe';
                            this.p2Type = 'solid';
                            this.assigned = true; } else if (psolids.length > 0 && pstripes.length > 0) { this.p1Type =
                                psolids.length >= pstripes.length ? 'solid' : 'stripe';
                            this.p2Type = this.p1Type === 'solid' ? 'stripe' : 'solid';
                            this.assigned = true; }
                    }
                    if (this.assigned) {
                        const s1 = this.balls.filter(b => b.isSolid && b.pocketed).length;
                        const s2 = this.balls.filter(b => b.isStripe && b.pocketed).length;
                        this.scores[1] = this.p1Type === 'solid' ? s1 : s2;
                        this.scores[2] = this.p2Type === 'solid' ? s1 : s2;
                    }
                    const ownPocketed = this.pocketedShot.some(b => {
                        const t = this.curPlayer === 1 ? this.p1Type : this.p2Type;
                        return (t === 'solid' && b.isSolid) || (t === 'stripe' && b.isStripe);
                    });
                    if (foul || (!ownPocketed && this.pocketedShot.length > 0 && this.assigned) || (this.pocketedShot
                            .length === 0 && !foul && !this.assigned && this.pocketedShot.length === 0 && this
                            .firstContact === null)) switchTurn = true;
                    if (!this.assigned && !foul && this.pocketedShot.length > 0) switchTurn = false;
                    if (foul && this.pocketedShot.length === 0 && !pCue) switchTurn = true;
                    if (switchTurn && !this.gameOver) this.curPlayer = this.curPlayer === 1 ? 2 : 1;
                    this.pocketedShot = [];
                    this.foulShot = false;
                    this.firstContact = null;
                    this.cue.visible = true;
                    this.cue.power = 0;
                    this.cue.pullback = 0;
                }
                executeShot(power, angle) {
                    if (this.shotActive || this.gameOver) return;
                    this.shotActive = true;
                    this.pocketedShot = [];
                    this.foulShot = false;
                    this.firstContact = null;
                    this.cue.visible = false;
                    this.cueBall.vel.copy(Vec2.fromAngle(angle).scale(power));
                    this.cueBall.spin = 0;
                    if (this.audio) this.audio.cueStrike(power);
                    this.shake = Math.min(4, power / MAX_POWER * 3.5);
                    this.particles.emit(this.cueBall.pos.x, this.cueBall.pos.y, 10, 'rgb(255,255,240)', power * 0.5, 0.18,
                        2.5);
                    this.cue.animating = true;
                    this.cue.animT = 0;
                }
                update(dt) {
                    if (this.paused || this.gameOver) { this.particles.update(dt); if (this.winCeleb > 0) this
                        .winCeleb -= dt; if (this.foulTimer > 0) this.foulTimer -= dt; return; }
                    this.physics.update(this.balls, dt);
                    this.particles.update(dt);
                    if (this.shake > 0.01) { this.shake *= 0.88;
                        this.shakeX = (Math.random() - 0.5) * this.shake * 7;
                        this.shakeY = (Math.random() - 0.5) * this.shake * 7; } else { this.shake = 0;
                        this.shakeX = 0;
                        this.shakeY = 0; }
                    if (this.foulTimer > 0) this.foulTimer -= dt;
                    if (this.cue.animating) { this.cue.animT += dt; if (this.cue.animT >= this.cue.animDur) { this.cue
                                .animating = false;
                            this.cue.animT = 0; } }
                    if (this.shotActive && !this.firstContact) {
                        for (const b of this.balls) {
                            if (b === this.cueBall || b.pocketed) continue;
                            if (this.cueBall.pos.dist(b.pos) < BALL_R * 2 + 0.8 && this.cueBall.vel.len() > 0.4) { this
                                    .firstContact = b; break; }
                        }
                    }
                    if (this.shotActive) {
                        for (const b of this.balls) { if (b.pocketed && !this.pocketedShot.includes(b) && b !== this
                                .cueBall) this.pocketedShot.push(b); }
                        if (this.firstContact && this.assigned) {
                            const pt = this.curPlayer === 1 ? this.p1Type : this.p2Type;
                            const own = (pt === 'solid' && this.firstContact.isSolid) || (pt === 'stripe' && this
                                .firstContact.isStripe);
                            if (!own && !this.firstContact.isEight) this.foulShot = true;
                            if (this.firstContact.isEight && !this.allPocketed(this.curPlayer)) this.foulShot = true;
                        }
                    }
                    if (this.shotActive && this.physics.allStopped(this.balls)) {
                        this.shotActive = false;
                        if (this.cueBall.pocketed && !this.pocketedShot.includes(this.cueBall)) this.pocketedShot.push(this
                            .cueBall);
                        this.handleShotResult();
                    }
                    if (this.winCeleb > 0) this.winCeleb -= dt;
                }
            }

            // ──────────────────────────────────────
            // AI
            // ──────────────────────────────────────
            class AIPlayer {
                constructor(gm) {
                    this.gm = gm;
                    this.diff = 'medium';
                    this.thinking = false;
                    this.timer = 0;
                    this.tAngle = 0;
                    this.tPower = 0;
                    this.ready = false;
                }
                accuracy() { return this.diff === 'easy' ? 0.3 + Math.random() * 0.45 : this.diff === 'medium' ? 0.55 + Math
                        .random() * 0.35 : 0.75 + Math.random() * 0.2; }
                powVar() { return this.diff === 'easy' ? 0.35 + Math.random() * 0.5 : this.diff === 'medium' ? 0.55 + Math
                        .random() * 0.38 : 0.7 + Math.random() * 0.28; }
                plan() {
                    if (this.gm.shotActive || this.gm.gameOver) { this.ready = false; return; }
                    this.thinking = true;
                    this.timer = 0.5 + Math.random() * 0.9;
                    this.ready = false;
                    const pt = this.gm.curPlayer === 1 ? this.gm.p1Type : this.gm.p2Type;
                    const targets = this.gm.balls.filter(b => !b.pocketed && !b.isCue && !b.isEight && ((pt === 'solid' &&
                        b.isSolid) || (pt === 'stripe' && b.isStripe)));
                    const eight = this.gm.balls.find(b => b.number === 8 && !b.pocketed);
                    const targs = targets.length > 0 ? targets : (eight ? [eight] : []);
                    if (targs.length === 0) {
                        const anyB = this.gm.balls.find(b => !b.pocketed && !b.isCue);
                        if (anyB) { const tv = anyB.pos.clone().sub(this.gm.cueBall.pos);
                            this.tAngle = tv.angle();
                            this.tPower = 7 + Math.random() * 9; }
                    } else {
                        let best = targs[0];
                        let bestS = -Infinity;
                        for (const t of targs) {
                            let minPd = Infinity;
                            for (const p of this.gm.table.pockets) { const d = t.pos.dist(p.pos); if (d < minPd) minPd =
                                d; }
                            const dc = this.gm.cueBall.pos.dist(t.pos);
                            const sc = -minPd * 2 - dc * 0.25 + (Math.random() - 0.5) * 60;
                            if (sc > bestS) { bestS = sc;
                                best = t; }
                        }
                        let np = this.gm.table.pockets[0];
                        let md = best.pos.dist(np.pos);
                        for (const p of this.gm.table.pockets) { const d = best.pos.dist(p.pos); if (d < md) { md = d;
                                np = p; } }
                        const ghost = best.pos.clone().sub(np.pos.clone().sub(best.pos).norm().scale(BALL_R * 2));
                        const toGhost = ghost.sub(this.gm.cueBall.pos);
                        let aim = toGhost.angle();
                        aim += (Math.random() - 0.5) * (1 - this.accuracy()) * 0.7;
                        this.tAngle = aim;
                        this.tPower = Math.min(MAX_POWER, Math.max(MIN_POWER, (5 + Math.min(1, toGhost.len() / 300) * 15) *
                            this.powVar()));
                    }
                }
                update(dt) { if (this.thinking) { this.timer -= dt; if (this.timer <= 0) { this.thinking = false;
                            this.ready = true; } } }
                reset() { this.thinking = false;
                    this.ready = false;
                    this.timer = 0; }
            }

            // ──────────────────────────────────────
            // Main Game Class
            // ──────────────────────────────────────
            class PoolGame {
                constructor() {
                    this.audio = new AudioManager();
                    this.gm = new GameManager(this.audio);
                    this.ai = new AIPlayer(this.gm);
                    this.canvas = canvas;
                    this.ctx = ctx;
                    this.scale = 1;
                    this.ox = 0;
                    this.oy = 0;
                    this.lastT = performance.now();
                    this.mouse = new Vec2();
                    this.dragging = false;
                    this.dragStart = null;
                    this.dragCur = null;
                    this.mode = 'practice';
                    this._resize();
                    this._bindEvents();
                    this.gm.setupRack();
                    this._showMenu('mainMenu');
                    this._loop(performance.now());
                }
                _resize() {
                    const cw = container.clientWidth;
                    const ch = container.clientHeight;
                    const aspect = (TABLE_W + RAIL_W * 2) / (TABLE_H + RAIL_W * 2);
                    let w, h;
                    if (cw / ch > aspect) { h = ch * 0.92;
                        w = h * aspect; } else { w = cw * 0.92;
                        h = w / aspect; }
                    this.canvas.width = w;
                    this.canvas.height = h;
                    this.scale = w / (TABLE_W + RAIL_W * 2);
                    this.ox = w / 2;
                    this.oy = h / 2;
                }
                _bindEvents() {
                    window.addEventListener('resize', () => this._resize());
                    window.addEventListener('orientationchange', () => setTimeout(() => this._resize(), 200));
                    const getPos = (e) => {
                        const r = this.canvas.getBoundingClientRect();
                        return new Vec2(e.clientX - r.left, e.clientY - r.top);
                    };
                    const toWorld = (cp) => new Vec2((cp.x - this.ox) / this.scale, (cp.y - this.oy) / this.scale);

                    const onDown = (e) => {
                        if (!e || this.gm.shotActive || this.gm.gameOver || this.gm.paused) return;
                        if (this.mode === 'ai' && this.gm.curPlayer === 2) return;
                        this.dragging = true;
                        this.dragStart = getPos(e);
                        this.dragCur = this.dragStart.clone();
                        this.gm.aiming = true;
                    };
                    const onMove = (e) => {
                        if (!e) return;
                        this.mouse = getPos(e);
                        if (this.dragging) {
                            this.dragCur = this.mouse.clone();
                            const cueWorld = this.gm.cueBall.pos;
                            const cueCanv = new Vec2(cueWorld.x * this.scale + this.ox, cueWorld.y * this.scale + this
                                .oy);
                            const dv = cueCanv.clone().sub(this.dragCur);
                            const dist = dv.len();
                            this.gm.cue.angle = dv.angle();
                            this.gm.cue.power = Math.min(MAX_POWER, Math.max(0, dist / (this.scale * 7)));
                            this.gm.cue.pullback = Math.min(90, dist * 0.65);
                            this.gm.cue.visible = true;
                        } else if (!this.gm.shotActive && !this.gm.gameOver && !this.gm.paused) {
                            const wm = toWorld(this.mouse);
                            const tv = wm.sub(this.gm.cueBall.pos);
                            if (tv.len() > 0.001) this.gm.cue.angle = tv.angle();
                            this.gm.cue.power = 0;
                            this.gm.cue.pullback = 0;
                        }
                    };
                    const onUp = (e) => {
                        if (!this.dragging) return;
                        this.dragging = false;
                        this.gm.aiming = false;
                        const power = this.gm.cue.power;
                        const angle = this.gm.cue.angle;
                        if (power > MIN_POWER && !this.gm.shotActive && !this.gm.gameOver) {
                            if (this.mode === 'ai' && this.gm.curPlayer === 2) return;
                            this.gm.executeShot(power, angle);
                            this.ai.reset();
                            this.gm.cue.pullback = 0;
                            this.gm.cue.power = 0;
                        }
                        this.dragStart = null;
                        this.dragCur = null;
                    };

                    this.canvas.addEventListener('mousedown', (e) => onDown(e));
                    this.canvas.addEventListener('mousemove', (e) => onMove(e));
                    this.canvas.addEventListener('mouseup', (e) => onUp(e));
                    this.canvas.addEventListener('mouseleave', () => { if (this.dragging) onUp(null); });
                    this.canvas.addEventListener('touchstart', (e) => { e.preventDefault();
                        onDown(e.touches[0]); }, { passive: false });
                    this.canvas.addEventListener('touchmove', (e) => { e.preventDefault();
                        onMove(e.touches[0]); }, { passive: false });
                    this.canvas.addEventListener('touchend', (e) => { e.preventDefault();
                        onUp(null); });
                    this.canvas.addEventListener('touchcancel', () => { if (this.dragging) onUp(null); });

                    window.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' || e.key === 'p') {
                            if (this.gm.gameOver) return;
                            this.gm.paused ? this._resume() : this._pause();
                        }
                    });

                    // Button bindings
                    document.getElementById('btnPractice').addEventListener('click', () => this._start('practice'));
                    document.getElementById('btnPvP').addEventListener('click', () => this._start('pvp'));
                    document.getElementById('btnAI').addEventListener('click', () => this._start('ai'));
                    document.getElementById('btnSettings').addEventListener('click', () => this._showMenu(
                        'settingsMenu'));
                    document.getElementById('btnSettingsBack').addEventListener('click', () => this._showMenu(
                        'mainMenu'));
                    document.getElementById('btnResume').addEventListener('click', () => this._resume());
                    document.getElementById('btnRestart').addEventListener('click', () => this._restart());
                    document.getElementById('btnQuit').addEventListener('click', () => this._quit());
                    document.getElementById('btnPlayAgain').addEventListener('click', () => this._restart());
                    document.getElementById('btnGoMenu').addEventListener('click', () => this._quit());
                    document.getElementById('aiDifficulty').addEventListener('change', (e) => { this.ai.diff = e.target
                            .value;
                        this.gm.aiDiff = e.target.value; });
                    document.getElementById('soundToggle').addEventListener('change', (e) => { this.audio.enabled = e
                            .target.checked; if (!e.target.checked) this.audio.stopMusic(); });
                    document.getElementById('musicToggle').addEventListener('change', (e) => { this.audio.musicOn = e
                            .target.checked; e.target.checked ? this.audio.startMusic() : this.audio.stopMusic(); });
                    document.getElementById('guideToggle').addEventListener('change', (e) => { this.gm.showGuide = e
                            .target.checked; });
                    document.getElementById('tableTheme').addEventListener('change', (e) => { this.gm.table.theme = e
                            .target.value; });
                }
                _start(mode) {
                    this.mode = mode;
                    this.gm.mode = mode;
                    this.gm.setupRack();
                    this.ai.reset();
                    this.ai.diff = document.getElementById('aiDifficulty')?.value || 'medium';
                    this.gm.aiDiff = this.ai.diff;
                    this.gm.paused = false;
                    this.gm.gameOver = false;
                    this.gm.curPlayer = 1;
                    this.gm.cue.visible = true;
                    this.gm.cue.power = 0;
                    this.gm.cue.pullback = 0;
                    this.gm.foulMsg = '';
                    this.gm.foulTimer = 0;
                    this._hideAll();
                    this._updateHUD();
                    document.getElementById('power-indicator').style.display = 'block';
                    if (this.audio.musicOn) this.audio.startMusic();
                }
                _pause() { if (this.gm.gameOver) return;
                    this.gm.paused = true;
                    document.getElementById('pauseMenu').classList.remove('hidden'); }
                _resume() { this.gm.paused = false;
                    this._hideAll(); }
                _restart() { this._start(this.mode); }
                _quit() { this.gm.paused = false;
                    this.gm.gameOver = false;
                    this.gm.cue.visible = false;
                    this.audio.stopMusic();
                    this._hideAll();
                    this._showMenu('mainMenu');
                    document.getElementById('power-indicator').style.display = 'none'; }
                _showMenu(id) { this._hideAll();
                    document.getElementById(id).classList.remove('hidden'); }
                _hideAll() { ['mainMenu', 'settingsMenu', 'pauseMenu', 'gameOverMenu'].forEach(id => document
                        .getElementById(id).classList.add('hidden')); }
                _updateHUD() {
                    document.getElementById('hudP1').textContent =
                        `${this.gm.p1Type==='solid'?'🔵':'🟡'} P1: ${this.gm.scores[1]}`;
                    document.getElementById('hudP2').textContent =
                        `P2: ${this.gm.scores[2]} ${this.gm.p2Type==='solid'?'🔵':'🟡'}`;
                    document.getElementById('hudTurn').textContent = `▶ Player ${this.gm.curPlayer}`;
                    const fe = document.getElementById('hudFoul');
                    if (this.gm.foulTimer > 0 && this.gm.foulMsg) { fe.style.display = 'inline';
                        fe.textContent = '⚠ ' + this.gm.foulMsg; } else fe.style.display = 'none';
                }
                _drawGuide() {
                    if (!this.gm.showGuide || !this.gm.cue.visible || this.gm.shotActive || this.gm.gameOver) return;
                    if (this.gm.cue.power < 0.2 && !this.dragging && !this.gm.aiming) return;
                    if (this.mode === 'ai' && this.gm.curPlayer === 2 && !this.dragging) return;
                    const a = this.gm.cue.angle;
                    const cw = this.gm.cueBall.pos;
                    const sx = cw.x * this.scale + this.ox;
                    const sy = cw.y * this.scale + this.oy;
                    const len = 280 * this.scale;
                    this.ctx.save();
                    this.ctx.setLineDash([5, 7]);
                    this.ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                    this.ctx.lineWidth = 1.6;
                    this.ctx.beginPath();
                    this.ctx.moveTo(sx, sy);
                    this.ctx.lineTo(sx + Math.cos(a) * len, sy + Math.sin(a) * len);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                    if (this.gm.cue.power > 0.15) {
                        const frac = this.gm.cue.power / MAX_POWER;
                        this.ctx.strokeStyle =
                            `rgba(255,${200-frac*150},${50-frac*40},0.7)`;
                        this.ctx.lineWidth = 2 + frac * 3;
                        this.ctx.beginPath();
                        this.ctx.arc(sx, sy, BALL_R * this.scale + 4 + frac * 10, 0, Math.PI * 2 * frac);
                        this.ctx.stroke();
                    }
                    this.ctx.restore();
                }
                _drawCelebration() {
                    if (this.gm.winCeleb <= 0) return;
                    const a = Math.min(1, this.gm.winCeleb / 2.5);
                    this.ctx.fillStyle = `rgba(255,215,0,${a*0.3})`;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    for (let i = 0; i < 35; i++) {
                        this.ctx.fillStyle =
                            `rgba(255,240,200,${a*Math.random()})`;
                        this.ctx.beginPath();
                        this.ctx.arc(Math.random() * this.canvas.width, Math.random() * this.canvas.height, Math.random() *
                            4 + 1, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    this.ctx.fillStyle = `rgba(255,255,255,${a})`;
                    this.ctx.font = `bold ${34*this.scale}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('🏆 Player ' + this.gm.winner + ' Wins! 🏆', this.canvas.width / 2, this.canvas.height /
                        2 - 15);
                }
                _render() {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    const sx = this.ox + this.gm.shakeX;
                    const sy = this.oy + this.gm.shakeY;
                    this.gm.table.draw(this.ctx, this.scale, sx, sy);
                    this.gm.particles.draw(this.ctx, this.scale, sx, sy);
                    for (const b of this.gm.balls) b.draw(this.ctx, this.scale, sx, sy);
                    this._drawGuide();
                    if (this.gm.cue.visible && !this.gm.shotActive && !this.gm.gameOver) {
                        if (!(this.mode === 'ai' && this.gm.curPlayer === 2))
                            this.gm.cue.draw(this.ctx, this.scale, sx, sy, this.gm.cueBall.pos);
                    }
                    this._drawCelebration();
                    if (this.gm.foulTimer > 0 && this.gm.foulMsg) {
                        const a = Math.min(1, this.gm.foulTimer);
                        this.ctx.fillStyle = `rgba(200,40,20,${a*0.8})`;
                        this.ctx.font = `bold ${17*this.scale}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText(this.gm.foulMsg, this.canvas.width / 2, this.canvas.height * 0.14);
                    }
                    document.getElementById('powerBarFill').style.height = (this.gm.cue.power / MAX_POWER * 100) + '%';
                }
                _loop(ts) {
                    const dt = Math.min(0.05, (ts - this.lastT) / 1000);
                    this.lastT = ts;
                    if (this.mode === 'ai' && this.gm.curPlayer === 2 && !this.gm.shotActive && !this.gm.gameOver && !this
                        .gm.paused) {
                        if (!this.ai.thinking && !this.ai.ready) this.ai.plan();
                        this.ai.update(dt);
                        if (this.ai.ready && !this.gm.shotActive) {
                            const { tAngle, tPower } = this.ai;
                            if (tPower > MIN_POWER) {
                                this.gm.cue.angle = tAngle;
                                this.gm.cue.power = tPower;
                                this.gm.cue.pullback = tPower * 3;
                                const shoot = () => {
                                    if (!this.gm.shotActive && !this.gm.gameOver && this.ai.ready) {
                                        this.gm.executeShot(tPower, tAngle);
                                        this.ai.reset();
                                        this.gm.cue.pullback = 0;
                                        this.gm.cue.power = 0;
                                    }
                                };
                                setTimeout(shoot, 280 + Math.random() * 350);
                                this.ai.ready = false;
                            }
                        }
                    }
                    this.gm.update(dt);
                    if (this.gm.gameOver && document.getElementById('gameOverMenu').classList.contains('hidden') && this.gm
                        .winCeleb < 0.3) {
                        document.getElementById('gameOverTitle').textContent = this.gm.winner === 1 ?
                            '🏆 Player 1 Wins!' : '🏆 Player 2 Wins!';
                        document.getElementById('gameOverMsg').textContent = this.mode === 'ai' && this.gm.winner === 2 ?
                            'The AI defeated you!' : 'Great game!';
                        document.getElementById('gameOverMenu').classList.remove('hidden');
                    }
                    this._updateHUD();
                    this._render();
                    requestAnimationFrame((t) => this._loop(t));
                }
            }

            const game = new PoolGame();
            console.log('🎱 8-Ball Pool ready — drag from the cue ball to aim and shoot!');
            console.log('   ESC to pause | Works with mouse & touch');
            window.poolGame = game;
        })();
    </script>
</body>
