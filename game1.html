                    // Keyboard
                    window.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' || e.key === 'p') {
                            if (this.gm.gameOver) return;
                            if (this.gm.paused) this.resumeGame();
                            else this.pauseGame();
                        }
                        if (e.key === ' ' && !this.gm.shotInProgress && !this.gm.gameOver && !this.gm.paused) {
                            e.preventDefault();
                            // Quick shot at current aim
                            if (this.gm.cue.power > 0.5) {
                                this.gm.executeShot(this.gm.cue.power, this.gm.cue.angle);
                                this.ai.reset();
                            }
                        }
                    });

                    // Button bindings
                    document.getElementById('btnPractice')?.addEventListener('click', () => this.startGame('practice'));
                    document.getElementById('btnPvP')?.addEventListener('click', () => this.startGame('pvp'));
                    document.getElementById('btnAI')?.addEventListener('click', () => this.startGame('ai'));
                    document.getElementById('btnSettings')?.addEventListener('click', () => this.showMenu(
                        'settingsMenu'));
                    document.getElementById('btnSettingsBack')?.addEventListener('click', () => this.showMenu(
                    'mainMenu'));
                    document.getElementById('btnResume')?.addEventListener('click', () => this.resumeGame());
                    document.getElementById('btnRestart')?.addEventListener('click', () => this.restartGame());
                    document.getElementById('btnQuit')?.addEventListener('click', () => this.quitToMenu());
                    document.getElementById('btnPlayAgain')?.addEventListener('click', () => this.restartGame());
                    document.getElementById('btnGoMenu')?.addEventListener('click', () => this.quitToMenu());

                    // Settings
                    document.getElementById('aiDifficulty')?.addEventListener('change', (e) => {
                        this.ai.difficulty = e.target.value;
                        this.gm.aiDifficulty = e.target.value;
                    });
                    document.getElementById('soundToggle')?.addEventListener('change', (e) => {
                        this.audio.enabled = e.target.checked;
                        this.gm.soundEnabled = e.target.checked;
                        if (!e.target.checked) this.audio.stopMusic();
                    });
                    document.getElementById('musicToggle')?.addEventListener('change', (e) => {
                        this.audio.musicEnabled = e.target.checked;
                        this.gm.musicEnabled = e.target.checked;
                        if (e.target.checked) this.audio.startMusic();
                        else this.audio.stopMusic();
                    });
                    document.getElementById('guideToggle')?.addEventListener('change', (e) => {
                        this.gm.showGuide = e.target.checked;
                    });
                    document.getElementById('tableTheme')?.addEventListener('change', (e) => {
                        this.gm.table.theme = e.target.value;
                    });
                }

                getCanvasPos(e) {
                    const rect = this.canvas.getBoundingClientRect();
                    return new Vec2(e.clientX - rect.left, e.clientY - rect.top);
                }

                tableToWorld(canvasPos) {
                    return new Vec2(
                        (canvasPos.x - this.offsetX) / this.scale,
                        (canvasPos.y - this.offsetY) / this.scale
                    );
                }

                onPointerDown(e) {
                    if (!e || this.gm.shotInProgress || this.gm.gameOver || this.gm.paused) return;
                    if (this.gameMode === 'ai' && this.gm.currentPlayer === 2) return;
                    this.isDragging = true;
                    this.dragStart = this.getCanvasPos(e);
                    this.dragCurrent = this.dragStart.clone();
                    this.gm.aiming = true;
                }

                onPointerMove(e) {
                    if (!e) return;
                    this.mousePos = this.getCanvasPos(e);
                    if (this.isDragging) {
                        this.dragCurrent = this.mousePos.clone();
                        // Calculate aim from drag
                        const worldCue = this.gm.cueBall.pos.clone();
                        const canvasCue = new Vec2(
                            worldCue.x * this.scale + this.offsetX,
                            worldCue.y * this.scale + this.offsetY
                        );
                        const dragVec = canvasCue.clone().sub(this.dragCurrent);
                        const dist = dragVec.length();
                        this.gm.cue.angle = dragVec.angle();
                        this.gm.cue.power = Math.min(MAX_POWER, Math.max(0, dist / (this.scale * 8)));
                        this.gm.cue.pullback = Math.min(80, dist * 0.7);
                        this.gm.cue.visible = true;
                    } else if (!this.gm.shotInProgress && !this.gm.gameOver && !this.gm.paused) {
                        // Show aim line toward mouse
                        const worldMouse = this.tableToWorld(this.mousePos);
                        const toMouse = worldMouse.sub(this.gm.cueBall.pos);
                        if (toMouse.length() > 0.001) {
                            this.gm.cue.angle = toMouse.angle();
                        }
                        this.gm.cue.power = 0;
                        this.gm.cue.pullback = 0;
                    }
                }

                onPointerUp(e) {
                    if (!this.isDragging) return;
                    this.isDragging = false;
                    this.gm.aiming = false;
                    const power = this.gm.cue.power;
                    const angle = this.gm.cue.angle;
                    if (power > MIN_POWER && !this.gm.shotInProgress && !this.gm.gameOver) {
                        if (this.gameMode === 'ai' && this.gm.currentPlayer === 2) return;
                        this.gm.executeShot(power, angle);
                        this.ai.reset();
                        this.gm.cue.pullback = 0;
                        this.gm.cue.power = 0;
                    }
                    this.dragStart = null;
                    this.dragCurrent = null;
                }

                startGame(mode) {
                    this.gameMode = mode;
                    this.gm.gameMode = mode;
                    this.gm.setupRack();
                    this.ai.reset();
                    this.ai.difficulty = document.getElementById('aiDifficulty')?.value || 'medium';
                    this.gm.aiDifficulty = this.ai.difficulty;
                    this.gm.paused = false;
                    this.gm.gameOver = false;
                    this.gm.currentPlayer = 1;
                    this.gm.cue.visible = true;
                    this.gm.cue.power = 0;
                    this.gm.cue.pullback = 0;
                    this.gm.foulMessage = '';
                    this.gm.foulMessageTimer = 0;
                    this.hideAllMenus();
                    this.updateHUD();
                    document.getElementById('power-indicator').style.display = 'block';
                    if (this.audio.musicEnabled) this.audio.startMusic();
                }

                pauseGame() {
                    if (this.gm.gameOver) return;
                    this.gm.paused = true;
                    document.getElementById('pauseMenu').classList.remove('hidden');
                }

                resumeGame() {
                    this.gm.paused = false;
                    this.hideAllMenus();
                }

                restartGame() {
                    this.gm.setupRack();
                    this.ai.reset();
                    this.gm.paused = false;
                    this.gm.gameOver = false;
                    this.gm.currentPlayer = 1;
                    this.gm.cue.visible = true;
                    this.gm.cue.power = 0;
                    this.gm.cue.pullback = 0;
                    this.gm.foulMessage = '';
                    this.gm.foulMessageTimer = 0;
                    this.gm.winCelebration = 0;
                    this.hideAllMenus();
                    this.updateHUD();
                }

                quitToMenu() {
                    this.gm.paused = false;
                    this.gm.gameOver = false;
                    this.gm.cue.visible = false;
                    this.audio.stopMusic();
                    this.hideAllMenus();
                    this.showMenu('mainMenu');
                    document.getElementById('power-indicator').style.display = 'none';
                }

                showMenu(id) {
                    this.hideAllMenus();
                    const el = document.getElementById(id);
                    if (el) el.classList.remove('hidden');
                }

                hideAllMenus() {
                    ['mainMenu', 'settingsMenu', 'pauseMenu', 'gameOverMenu'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.add('hidden');
                    });
                }

                updateHUD() {
                    const p1Type = this.gm.player1Type || 'solid';
                    const p2Type = this.gm.player2Type || 'stripe';
                    const p1Icon = p1Type === 'solid' ? '🔵' : '🟡';
                    const p2Icon = p2Type === 'solid' ? '🔵' : '🟡';

                    document.getElementById('hudP1').textContent =
                        `${p1Icon} P1: ${this.gm.scores[1] || 0}`;
                    document.getElementById('hudP2').textContent =
                        `P2: ${this.gm.scores[2] || 0} ${p2Icon === '🔵' ? '🔴' : '🔵'}`;
                    document.getElementById('hudTurn').textContent =
                        `▶ Player ${this.gm.currentPlayer}`;

                    const turnEl = document.getElementById('hudTurn');
                    turnEl.classList.toggle('turn', !this.gm.gameOver);
                    const foulEl = document.getElementById('hudFoul');
                    if (this.gm.foulMessageTimer > 0 && this.gm.foulMessage) {
                        foulEl.style.display = 'inline';
                        foulEl.textContent = '⚠ ' + this.gm.foulMessage;
                    } else {
                        foulEl.style.display = 'none';
                    }
                }

                drawAimGuide() {
                    if (!this.gm.showGuide || !this.gm.cue.visible || this.gm.shotInProgress || this.gm.gameOver) return;
                    if (this.gm.cue.power < 0.3 && !this.isDragging && !this.gm.aiming) return;
                    if (this.gameMode === 'ai' && this.gm.currentPlayer === 2 && !this.isDragging) return;

                    const angle = this.gm.cue.angle;
                    const cueWorld = this.gm.cueBall.pos;
                    const sx = cueWorld.x * this.scale + this.offsetX;
                    const sy = cueWorld.y * this.scale + this.offsetY;

                    // Dotted aim line
                    const lineLen = 250 * this.scale;
                    const endX = sx + Math.cos(angle) * lineLen;
                    const endY = sy + Math.sin(angle) * lineLen;

                    this.ctx.save();
                    this.ctx.setLineDash([6, 8]);
                    this.ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.beginPath();
                    this.ctx.moveTo(sx, sy);
                    this.ctx.lineTo(endX, endY);
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);

                    // Power ring around cue ball
                    if (this.gm.cue.power > 0.2) {
                        const powerFrac = this.gm.cue.power / MAX_POWER;
                        this.ctx.strokeStyle = `rgba(255,${200-powerFrac*150},${50-powerFrac*40},0.7)`;
                        this.ctx.lineWidth = 2 + powerFrac * 3;
                        this.ctx.beginPath();
                        this.ctx.arc(sx, sy, BALL_RADIUS * this.scale + 4 + powerFrac * 8, 0, Math.PI * 2 * powerFrac);
                        this.ctx.stroke();
                    }
                    this.ctx.restore();
                }

                drawWinCelebration() {
                    if (this.gm.winCelebration <= 0) return;
                    const alpha = Math.min(1, this.gm.winCelebration / 2);
                    this.ctx.fillStyle = `rgba(255,215,0,${alpha*0.3})`;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    // Sparkle particles
                    for (let i = 0; i < 30; i++) {
                        const x = Math.random() * this.canvas.width;
                        const y = Math.random() * this.canvas.height;
                        const sz = Math.random() * 4 + 1;
                        this.ctx.fillStyle = `rgba(255,240,200,${alpha*Math.random()})`;
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, sz, 0, Math.PI * 2);
                        this.ctx.fill();
                    }

                    this.ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    this.ctx.font = `${36*this.scale}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('🏆 Player ' + this.gm.winner + ' Wins! 🏆', this.canvas.width / 2, this.canvas
                        .height / 2 - 20);
                }

                render() {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                    // Apply camera shake
                    const shakeX = this.gm.cameraShakeX;
                    const shakeY = this.gm.cameraShakeY;
                    const ox = this.offsetX + shakeX;
                    const oy = this.offsetY + shakeY;

                    // Draw table
                    this.gm.table.draw(this.ctx, this.scale, ox, oy);

                    // Draw particles (under balls)
                    this.gm.particles.draw(this.ctx, this.scale, ox, oy);

                    // Draw balls
                    for (const ball of this.gm.balls) {
                        ball.draw(this.ctx, this.scale, ox, oy);
                    }

                    // Draw aim guide
                    this.drawAimGuide();

                    // Draw cue stick
                    if (this.gm.cue.visible && !this.gm.shotInProgress && !this.gm.gameOver) {
                        if (!(this.gameMode === 'ai' && this.gm.currentPlayer === 2)) {
                            this.gm.cue.draw(this.ctx, this.scale, ox, oy, this.gm.cueBall.pos);
                        }
                    }

                    // Win celebration
                    this.drawWinCelebration();

                    // Foul message overlay
                    if (this.gm.foulMessageTimer > 0 && this.gm.foulMessage) {
                        const alpha = Math.min(1, this.gm.foulMessageTimer);
                        this.ctx.fillStyle = `rgba(200,40,20,${alpha*0.8})`;
                        this.ctx.font = `bold ${18*this.scale}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText(this.gm.foulMessage, this.canvas.width / 2, this.canvas.height * 0.15);
                    }

                    // Update power bar
                    const powerFrac = this.gm.cue.power / MAX_POWER;
                    document.getElementById('powerBarFill').style.height = (powerFrac * 100) + '%';
                }

                loop(timestamp) {
                    const dt = Math.min(0.05, (timestamp - this.lastTime) / 1000);
                    this.lastTime = timestamp;

                    // AI logic
                    if (this.gameMode === 'ai' && this.gm.currentPlayer === 2 &&
                        !this.gm.shotInProgress && !this.gm.gameOver && !this.gm.paused) {
                        if (!this.ai.thinking && !this.ai.shotReady) {
                            this.ai.planShot();
                        }
                        this.ai.update(dt);
                        if (this.ai.shotReady && !this.gm.shotInProgress) {
                            const aim = this.ai.getAim();
                            if (aim.ready && aim.power > MIN_POWER) {
                                this.gm.cue.angle = aim.angle;
                                this.gm.cue.power = aim.power;
                                this.gm.cue.pullback = aim.power * 3;
                                // Brief delay then shoot
                                setTimeout(() => {
                                    if (!this.gm.shotInProgress && !this.gm.gameOver && this.ai.shotReady) {
                                        this.gm.executeShot(aim.power, aim.angle);
                                        this.ai.reset();
                                        this.gm.cue.pullback = 0;
                                        this.gm.cue.power = 0;
                                    }
                                }, 300 + Math.random() * 400);
                                this.ai.shotReady = false;
                            }
                        }
                    }

                    // Update game
                    this.gm.update(dt);

                    // Check game over
                    if (this.gm.gameOver && !document.getElementById('gameOverMenu').classList.contains('hidden') ===
                        false) {
                        if (this.gm.winCelebration <= 0.5 && document.getElementById('gameOverMenu').classList
                            .contains('hidden')) {
                            document.getElementById('gameOverTitle').textContent =
                                this.gm.winner === 1 ? '🏆 Player 1 Wins!' : '🏆 Player 2 Wins!';
                            document.getElementById('gameOverMsg').textContent =
                                this.gm.gameMode === 'ai' && this.gm.winner === 2 ?
                                'The AI has defeated you!' : 'Great game!';
                            document.getElementById('gameOverMenu').classList.remove('hidden');
                        }
                    }

                    this.updateHUD();
                    this.render();

                    requestAnimationFrame((t) => this.loop(t));
                }
            }

            // --- Initialize ---
            const game = new PoolGame();
            console.log('🎱 8-Ball Pool - Professional HTML5 Edition');
            console.log('   Drag to aim and shoot | ESC to pause | Supports touch & mouse');
            console.log('   Game modes: Practice | PvP | AI (Easy/Medium/Hard)');
            console.log('   Built with pure JavaScript & Canvas API');

            // Expose for debugging
            window.poolGame = game;
        })();
    </script>
