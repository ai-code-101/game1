<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>8-Ball Pool - Professional HTML5</title>
    <style>
        :root {
            --bg: #1a0a00;
            --panel-bg: rgba(20, 10, 0, 0.95);
            --gold: #c8a45c;
            --gold-light: #e0c878;
            --text: #e8dcc8;
            --text-bright: #fff;
            --accent: #d4a030;
            --danger: #c0392b;
            --success: #27ae60;
            --felt: #1a6b3c;
            --rail: #5c3a1e;
            --rail-dark: #3a1f0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            background-image: radial-gradient(ellipse at center, #1a1a0a 0%, #0a0a00 60%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 80px rgba(200, 150, 50, 0.25), 0 0 200px rgba(0, 0, 0, 0.7),
                0 20px 60px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
        }

        /* Overlay panels */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 30px 36px;
            text-align: center;
            color: var(--text);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(200, 150, 50, 0.2);
            z-index: 10;
            min-width: 280px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.9);
        }
        .overlay h1 {
            font-size: 2.2em;
            color: var(--gold-light);
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(200, 160, 60, 0.5);
        }
        .overlay h2 {
            font-size: 1.4em;
            color: var(--text-bright);
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .overlay h3 {
            font-size: 1em;
            color: var(--gold);
            margin-bottom: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .overlay p {
            margin: 6px 0;
            font-size: 0.95em;
            color: #b8a890;
        }
        .overlay button,
        .overlay .btn {
            display: inline-block;
            margin: 8px 6px;
            padding: 12px 28px;
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 1px;
            border: 2px solid var(--gold);
            background: linear-gradient(180deg, rgba(180, 130, 40, 0.3) 0%, rgba(100, 60, 20, 0.4) 100%);
            color: var(--text-bright);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .overlay button:hover,
        .overlay .btn:hover {
            background: linear-gradient(180deg, rgba(220, 170, 60, 0.5) 0%, rgba(140, 90, 30, 0.5) 100%);
            border-color: var(--gold-light);
            box-shadow: 0 0 20px rgba(200, 150, 50, 0.4);
            transform: translateY(-1px);
        }
        .overlay button:active,
        .overlay .btn:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }
        .overlay button.accent {
            background: linear-gradient(180deg, rgba(200, 140, 30, 0.6) 0%, rgba(140, 80, 20, 0.6) 100%);
            border-color: #e0b840;
        }
        .overlay button.danger {
            border-color: #c0392b;
            color: #e88;
            background: linear-gradient(180deg, rgba(180, 40, 30, 0.3) 0%, rgba(80, 20, 10, 0.4) 100%);
        }
        .overlay button.small {
            padding: 8px 18px;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        /* Settings rows */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            gap: 16px;
            font-size: 0.9em;
        }
        .setting-row label {
            color: #c8b898;
            white-space: nowrap;
        }
        .setting-row select,
        .setting-row input[type="range"] {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #5a4a30;
            background: #1a1008;
            color: #d8c8a8;
            font-size: 0.9em;
            cursor: pointer;
        }
        .setting-row select {
            min-width: 120px;
        }
        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            flex-shrink: 0;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #3a2a15;
            border-radius: 26px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #5a4a30;
        }
        .toggle-slider:before {
            content: '';
            position: absolute;
            height: 20px;
            width: 20px;
            left: 2px;
            top: 2px;
            background: #8a7a5a;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked+.toggle-slider {
            background: #4a8a3a;
            border-color: #5a9a4a;
        }
        input:checked+.toggle-slider:before {
            transform: translateX(22px);
            background: #b8d8a0;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hud-item {
            background: rgba(10, 5, 0, 0.8);
            border: 1px solid rgba(180, 140, 80, 0.5);
            border-radius: 20px;
            padding: 6px 16px;
            color: #e8d8b8;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
        }
        .hud-item.turn {
            border-color: #e0b840;
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: #e0b840;
                box-shadow: 0 0 8px rgba(200, 150, 40, 0.3);
            }
            50% {
                border-color: #ffd060;
                box-shadow: 0 0 18px rgba(240, 190, 60, 0.6);
            }
        }
        .hud-item.player1 {
            border-left: 3px solid #4a90d9;
        }
        .hud-item.player2 {
            border-left: 3px solid #d94a4a;
        }

        /* Power meter on canvas */
        #power-indicator {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
        }
        .power-label {
            color: #c8b898;
            font-size: 0.7em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .power-bar-outer {
            width: 10px;
            height: 120px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(180, 140, 80, 0.5);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .power-bar-inner {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #4a4, #fa0, #f44);
            border-radius: 5px;
            transition: height 0.05s linear;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .overlay {
                padding: 20px 22px;
                min-width: 240px;
                border-radius: 12px;
            }
            .overlay h1 {
                font-size: 1.5em;
            }
            .overlay h2 {
                font-size: 1.1em;
            }
            .overlay button {
                padding: 10px 20px;
                font-size: 0.85em;
                margin: 5px 4px;
            }
            #hud {
                top: 4px;
                gap: 8px;
            }
            .hud-item {
                padding: 4px 10px;
                font-size: 0.7em;
                border-radius: 14px;
            }
            #power-indicator {
                bottom: 16px;
                right: 12px;
            }
            .power-bar-outer {
                width: 8px;
                height: 80px;
            }
        }
        @media (max-width: 380px) {
            .overlay {
                padding: 14px 16px;
                min-width: 200px;
                border-radius: 10px;
            }
            .overlay h1 {
                font-size: 1.2em;
            }
            .overlay h2 {
                font-size: 0.95em;
            }
            .overlay button {
                padding: 8px 14px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="poolCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <span class="hud-item player1" id="hudP1">🎱 P1: 0</span>
            <span class="hud-item turn" id="hudTurn">▶ Player 1</span>
            <span class="hud-item player2" id="hudP2">P2: 0 🔴</span>
            <span class="hud-item" id="hudFoul" style="display:none;color:#f88;">⚠ Foul</span>
        </div>

        <!-- Power indicator (desktop helper) -->
        <div id="power-indicator">
            <span class="power-label">Power</span>
            <div class="power-bar-outer"><div class="power-bar-inner" id="powerBarFill" style="height:0%;"></div></div>
        </div>

        <!-- Main Menu -->
        <div class="overlay" id="mainMenu">
            <h1>🎱 8-BALL POOL</h1>
            <p style="color:#c8a45c;margin-bottom:16px;">Professional Edition</p>
            <button class="accent" id="btnPractice">🏋️ Practice Mode</button><br>
            <button id="btnPvP">👥 Player vs Player</button><br>
            <button id="btnAI">🤖 vs AI Opponent</button><br>
            <button class="small" id="btnSettings">⚙️ Settings</button>
        </div>

        <!-- Settings Menu -->
        <div class="overlay hidden" id="settingsMenu">
            <h2>⚙️ Settings</h2>
            <div class="setting-row"><label>AI Difficulty</label>
                <select id="aiDifficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
            <div class="setting-row"><label>Sound FX</label>
                <label class="toggle-switch"><input type="checkbox" id="soundToggle" checked><span class="toggle-slider"></span></label></div>
            <div class="setting-row"><label>Music</label>
                <label class="toggle-switch"><input type="checkbox" id="musicToggle"><span class="toggle-slider"></span></label></div>
            <div class="setting-row"><label>Show Guide Line</label>
                <label class="toggle-switch"><input type="checkbox" id="guideToggle" checked><span class="toggle-slider"></span></label></div>
            <div class="setting-row"><label>Table Theme</label>
                <select id="tableTheme"><option value="classic">Classic Green</option><option value="blue">Tournament Blue</option><option value="red">Burgundy</option></select></div>
            <br>
            <button id="btnSettingsBack">← Back</button>
        </div>

        <!-- Pause Menu -->
        <div class="overlay hidden" id="pauseMenu">
            <h2>⏸️ Paused</h2>
            <button id="btnResume">▶ Resume</button><br>
            <button id="btnRestart">🔄 Restart</button><br>
            <button class="danger" id="btnQuit">🚪 Quit to Menu</button>
        </div>

        <!-- Game Over -->
        <div class="overlay hidden" id="gameOverMenu">
            <h2 id="gameOverTitle">🏆 Game Over</h2>
            <p id="gameOverMsg" style="font-size:1.1em;color:#e0c878;"></p>
            <button class="accent" id="btnPlayAgain">🔄 Play Again</button><br>
            <button id="btnGoMenu">🏠 Main Menu</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  8-BALL POOL - Professional HTML5 Browser Game
        //  Complete physics engine, AI opponent, 8-ball rules
        // ============================================================

        (function() {
            // --- DOM Elements ---
            const canvas = document.getElementById('poolCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('game-container');

            // --- Constants ---
            const TABLE_WIDTH = 800; // Internal units for playing surface
            const TABLE_HEIGHT = 400;
            const RAIL_WIDTH = 42;
            const BALL_RADIUS = 13;
            const POCKET_RADIUS = 22;
            const CORNER_POCKET_RADIUS = 24;
            const FRICTION = 0.985; // Per-frame friction (scaled by delta)
            const CUSHION_RESTITUTION = 0.7;
            const BALL_RESTITUTION = 0.92;
            const MAX_POWER = 22;
            const MIN_POWER = 1.5;
            const GRAVITY = 0; // Top-down, no gravity needed
            const POCKET_PULL_DIST = 28;

            // --- Audio Manager (Web Audio API procedural sounds) ---
            class AudioManager {
                constructor() {
                    this.enabled = true;
                    this.musicEnabled = false;
                    this.ctx = null;
                    this.musicOsc = null;
                    this.musicGain = null;
                    this.musicInterval = null;
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        this.enabled = false;
                    }
                }

                play(freq, type, duration, vol = 0.15, decay = true) {
                    if (!this.enabled || !this.ctx) return;
                    try {
                        const t = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, t);
                        gain.gain.setValueAtTime(vol, t);
                        if (decay) gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                        else gain.gain.setValueAtTime(vol, t + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t);
                        osc.stop(t + duration);
                    } catch (e) { /* silent */ }
                }

                cueStrike(power) {
                    const vol = 0.12 + power / MAX_POWER * 0.2;
                    this.play(180, 'square', 0.08, vol);
                    setTimeout(() => this.play(60, 'triangle', 0.15, vol * 0.7), 30);
                }

                ballHit(force) {
                    const vol = Math.min(0.18, force * 0.03);
                    this.play(300 + force * 40, 'sine', 0.06, vol);
                }

                pocketSound() {
                    this.play(80, 'triangle', 0.25, 0.2);
                    setTimeout(() => this.play(40, 'sine', 0.3, 0.15), 80);
                }

                cushionBounce() {
                    this.play(100, 'triangle', 0.06, 0.06);
                }

                foulSound() {
                    this.play(50, 'sawtooth', 0.4, 0.15);
                }

                victorySound() {
                    this.play(523, 'sine', 0.2, 0.18, false);
                    setTimeout(() => this.play(659, 'sine', 0.2, 0.18, false), 150);
                    setTimeout(() => this.play(784, 'sine', 0.3, 0.25, false), 300);
                }

                startMusic() {
                    if (!this.musicEnabled || !this.ctx || this.musicInterval) return;
                    const notes = [130.81, 146.83, 164.81, 174.61, 196, 220, 246.94, 261.63];
                    let idx = 0;
                    const playNote = () => {
                        if (!this.musicEnabled) return;
                        this.play(notes[idx % notes.length], 'sine', 0.8, 0.03, true);
                        idx++;
                    };
                    this.musicInterval = setInterval(playNote, 1200);
                    playNote();
                }

                stopMusic() {
                    if (this.musicInterval) {
                        clearInterval(this.musicInterval);
                        this.musicInterval = null;
                    }
                }

                toggleSound() {
                    this.enabled = !this.enabled;
                    if (!this.enabled) this.stopMusic();
                    return this.enabled;
                }
                toggleMusic() {
                    this.musicEnabled = !this.musicEnabled;
                    if (this.musicEnabled) this.startMusic();
                    else this.stopMusic();
                    return this.musicEnabled;
                }
            }

            // --- Vector Utilities ---
            class Vec2 {
                constructor(x = 0, y = 0) { this.x = x;
                    this.y = y; }
                set(x, y) { this.x = x;
                    this.y = y; return this; }
                copy(v) { this.x = v.x;
                    this.y = v.y; return this; }
                clone() { return new Vec2(this.x, this.y); }
                add(v) { this.x += v.x;
                    this.y += v.y; return this; }
                sub(v) { this.x -= v.x;
                    this.y -= v.y; return this; }
                scale(s) { this.x *= s;
                    this.y *= s; return this; }
                dot(v) { return this.x * v.x + this.y * v.y; }
                length() { return Math.sqrt(this.x * this.x + this.y * this.y); }
                lengthSq() { return this.x * this.x + this.y * this.y; }
                normalize() {
                    const len = this.length();
                    if (len > 0.0001) { this.x /= len;
                        this.y /= len; }
                    return this;
                }
                dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
                angle() { return Math.atan2(this.y, this.x); }
                static fromAngle(a) { return new Vec2(Math.cos(a), Math.sin(a)); }
            }

            // --- Ball Class ---
            class Ball {
                constructor(x, y, number, isCue = false) {
                    this.pos = new Vec2(x, y);
                    this.vel = new Vec2(0, 0);
                    this.radius = BALL_RADIUS;
                    this.number = number;
                    this.isCue = isCue;
                    this.pocketed = false;
                    this.isSolid = number >= 1 && number <= 7;
                    this.isStripe = number >= 9 && number <= 15;
                    this.isEight = number === 8;
                    this.spin = 0; // Simple spin factor
                    this.lastCollision = null;
                    this.trailPositions = [];
                }

                get color() {
                    if (this.isCue) return '#f8f8f0';
                    if (this.isEight) return '#111';
                    if (this.isSolid) {
                        const colors = ['#f4d03f', '#2471a3', '#c0392b', '#2e4053', '#f39c12',
                            '#1a5c2a', '#8b1a1a'
                        ];
                        return colors[this.number - 1] || '#888';
                    }
                    if (this.isStripe) {
                        const colors = ['#f7dc6f', '#2e86c1', '#e74c3c', '#3d2b6b', '#f0b27a',
                            '#27ae60', '#b03a2e'
                        ];
                        return colors[this.number - 9] || '#aaa';
                    }
                    return '#ccc';
                }

                get stripeColor() {
                    if (this.isStripe) {
                        const colors = ['#fff', '#fff', '#fff', '#e8d8f0', '#fff', '#fff', '#fff'];
                        return colors[this.number - 9] || '#fff';
                    }
                    return '#fff';
                }

                update(dt) {
                    if (this.pocketed) return;
                    // Apply friction (scaled by delta time factor)
                    const frictionFactor = Math.pow(FRICTION, dt * 60);
                    this.vel.scale(frictionFactor);
                    // Stop very slow movement
                    if (this.vel.length() < 0.08) {
                        this.vel.set(0, 0);
                    }
                    // Update position
                    this.pos.add(this.vel.clone().scale(dt));
                    // Trail for particles
                    if (this.vel.length() > 2) {
                        this.trailPositions.push(this.pos.clone());
                        if (this.trailPositions.length > 5) this.trailPositions.shift();
                    } else {
                        this.trailPositions = [];
                    }
                }

                draw(ctx, scale, offsetX, offsetY) {
                    if (this.pocketed) return;
                    const sx = this.pos.x * scale + offsetX;
                    const sy = this.pos.y * scale + offsetY;
                    const r = this.radius * scale;

                    // Shadow
                    ctx.save();
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.beginPath();
                    ctx.arc(sx + r * 0.15, sy + r * 0.2, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Ball body with gradient
                    const grad = ctx.createRadialGradient(sx - r * 0.3, sy - r * 0.35, r * 0.1, sx, sy, r);
                    if (this.isCue) {
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(0.5, '#f0efe8');
                        grad.addColorStop(0.85, '#d8d6d0');
                        grad.addColorStop(1, '#b8b5ae');
                    } else if (this.isEight) {
                        grad.addColorStop(0, '#444');
                        grad.addColorStop(0.4, '#1a1a1a');
                        grad.addColorStop(0.85, '#000');
                        grad.addColorStop(1, '#111');
                    } else if (this.isSolid) {
                        const c = this.color;
                        grad.addColorStop(0, this._lighten(c, 50));
                        grad.addColorStop(0.5, c);
                        grad.addColorStop(0.85, this._darken(c, 40));
                        grad.addColorStop(1, this._darken(c, 60));
                    } else if (this.isStripe) {
                        // Stripe: white base with colored band
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(0.35, '#f8f8f6');
                        grad.addColorStop(0.5, this.stripeColor);
                        grad.addColorStop(0.65, this.color);
                        grad.addColorStop(0.85, this._darken(this.color, 40));
                        grad.addColorStop(1, this._darken(this.color, 60));
                    }
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Specular highlight
                    const hlGrad = ctx.createRadialGradient(sx - r * 0.35, sy - r * 0.4, r * 0.05, sx - r * 0.1, sy - r *
                        0.15, r * 1.1);
                    hlGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
                    hlGrad.addColorStop(0.3, 'rgba(255,255,255,0.25)');
                    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = hlGrad;
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Number circle
                    if (this.number > 0 && !this.isCue) {
                        const nr = r * 0.42;
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.beginPath();
                        ctx.arc(sx, sy, nr, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#111';
                        ctx.font = `${r*0.7}px "Segoe UI","Helvetica Neue",Arial,sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(this.number, sx, sy + r * 0.02);
                    }

                    // Outline
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = r * 0.04;
                    ctx.beginPath();
                    ctx.arc(sx, sy, r, 0, Math.PI * 2);
                    ctx.stroke();
                }

                _lighten(hex, pct) {
                    const num = parseInt(hex.replace('#', ''), 16);
                    const r = Math.min(255, (num >> 16) + pct);
                    const g = Math.min(255, ((num >> 8) & 0x00FF00) + pct);
                    const b = Math.min(255, (num & 0x0000FF) + pct);
                    return `rgb(${r},${g},${b})`;
                }
                _darken(hex, pct) {
                    const num = parseInt(hex.replace('#', ''), 16);
                    const r = Math.max(0, (num >> 16) - pct);
                    const g = Math.max(0, ((num >> 8) & 0x00FF00) - pct);
                    const b = Math.max(0, (num & 0x0000FF) - pct);
                    return `rgb(${r},${g},${b})`;
                }
            }

            // --- Particle System ---
            class Particle {
                constructor(x, y, vx, vy, color, life = 0.5, size = 3) {
                    this.pos = new Vec2(x, y);
                    this.vel = new Vec2(vx, vy);
                    this.color = color;
                    this.life = life;
                    this.maxLife = life;
                    this.size = size;
                    this.alive = true;
                }
                update(dt) {
                    this.life -= dt;
                    if (this.life <= 0) { this.alive = false; return; }
                    this.pos.add(this.vel.clone().scale(dt));
                    this.vel.scale(0.95);
                }
                draw(ctx, scale, ox, oy) {
                    const alpha = this.life / this.maxLife;
                    const sx = this.pos.x * scale + ox;
                    const sy = this.pos.y * scale + oy;
                    ctx.fillStyle = this.color.replace('1)', `${alpha})`).replace('rgb',
                        'rgba');
                    ctx.beginPath();
                    ctx.arc(sx, sy, this.size * scale * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class ParticleSystem {
                constructor() { this.particles = []; }
                emit(x, y, count, color, force = 3, life = 0.5, size = 3) {
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * force;
                        this.particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color,
                            life + Math.random() * 0.3, size + Math.random() * 2));
                    }
                }
                update(dt) {
                    for (const p of this.particles) p.update(dt);
                    this.particles = this.particles.filter(p => p.alive);
                }
                draw(ctx, scale, ox, oy) {
                    for (const p of this.particles) p.draw(ctx, scale, ox, oy);
                }
                clear() { this.particles = []; }
            }

            // --- Table Class ---
            class Table {
                constructor() {
                    this.width = TABLE_WIDTH;
                    this.height = TABLE_HEIGHT;
                    this.railWidth = RAIL_WIDTH;
                    this.pocketRadius = POCKET_RADIUS;
                    this.cornerPocketRadius = CORNER_POCKET_RADIUS;
                    this.pockets = this._createPockets();
                    this.cushionSegments = this._createCushions();
                    this.theme = 'classic';
                }

                _createPockets() {
                    const r = this.cornerPocketRadius;
                    const sr = this.pocketRadius;
                    const hw = this.width / 2;
                    const hh = this.height / 2;
                    return [
                        { pos: new Vec2(-hw, -hh), radius: r, id: 'top-left' },
                        { pos: new Vec2(0, -hh - 2), radius: sr, id: 'top-center' },
                        { pos: new Vec2(hw, -hh), radius: r, id: 'top-right' },
                        { pos: new Vec2(-hw, hh), radius: r, id: 'bottom-left' },
                        { pos: new Vec2(0, hh + 2), radius: sr, id: 'bottom-center' },
                        { pos: new Vec2(hw, hh), radius: r, id: 'bottom-right' },
                    ];
                }

                _createCushions() {
                    const hw = this.width / 2;
                    const hh = this.height / 2;
                    const cr = this.cornerPocketRadius;
                    const sr = this.pocketRadius;
                    // Each cushion: {start, end, normal}
                    return [
                        // Top rail - left segment
                        { start: new Vec2(-hw + cr * 1.3, -hh), end: new Vec2(-sr * 0.9, -hh), normal: new Vec2(0, 1) },
                        // Top rail - right segment
                        { start: new Vec2(sr * 0.9, -hh), end: new Vec2(hw - cr * 1.3, -hh), normal: new Vec2(0, 1) },
                        // Bottom rail - left segment
                        { start: new Vec2(-hw + cr * 1.3, hh), end: new Vec2(-sr * 0.9, hh), normal: new Vec2(0, -1) },
                        // Bottom rail - right segment
                        { start: new Vec2(sr * 0.9, hh), end: new Vec2(hw - cr * 1.3, hh), normal: new Vec2(0, -1) },
                        // Left rail - top segment
                        { start: new Vec2(-hw, -hh + cr * 1.3), end: new Vec2(-hw, -sr * 0.9), normal: new Vec2(1, 0) },
                        // Left rail - bottom segment
                        { start: new Vec2(-hw, sr * 0.9), end: new Vec2(-hw, hh - cr * 1.3), normal: new Vec2(1, 0) },
                        // Right rail - top segment
                        { start: new Vec2(hw, -hh + cr * 1.3), end: new Vec2(hw, -sr * 0.9), normal: new Vec2(-1, 0) },
                        // Right rail - bottom segment
                        { start: new Vec2(hw, sr * 0.9), end: new Vec2(hw, hh - cr * 1.3), normal: new Vec2(-1, 0) },
                    ];
                }

                getFeltColor() {
                    if (this.theme === 'blue') return '#1a5c3a';
                    if (this.theme === 'red') return '#5c1a2a';
                    return '#1a6b3c'; // classic green
                }
                getFeltDark() {
                    if (this.theme === 'blue') return '#0d3a22';
                    if (this.theme === 'red') return '#3a0d18';
                    return '#0d4a25';
                }

                draw(ctx, scale, offsetX, offsetY) {
                    const tw = (this.width + this.railWidth * 2) * scale;
                    const th = (this.height + this.railWidth * 2) * scale;
                    const tx = offsetX - this.railWidth * scale;
                    const ty = offsetY - this.railWidth * scale;

                    // Outer frame shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(tx + 6, ty + 6, tw, th);

                    // Outer rail wood
                    const woodGrad = ctx.createLinearGradient(tx, ty, tx + tw, ty + th);
                    woodGrad.addColorStop(0, '#7a4a2a');
                    woodGrad.addColorStop(0.3, '#9a6a3a');
                    woodGrad.addColorStop(0.5, '#b0804a');
                    woodGrad.addColorStop(0.7, '#8a5a30');
                    woodGrad.addColorStop(1, '#5a3020');
                    ctx.fillStyle = woodGrad;
                    ctx.fillRect(tx, ty, tw, th);

                    // Inner rail (darker)
                    const innerX = tx + this.railWidth * scale * 0.55;
                    const innerY = ty + this.railWidth * scale * 0.55;
                    const innerW = tw - this.railWidth * scale * 1.1;
                    const innerH = th - this.railWidth * scale * 1.1;
                    const innerGrad = ctx.createLinearGradient(innerX, innerY, innerX + innerW, innerY + innerH);
                    innerGrad.addColorStop(0, '#3a1a08');
                    innerGrad.addColorStop(0.5, '#5a3020');
                    innerGrad.addColorStop(1, '#2a1005');
                    ctx.fillStyle = innerGrad;
                    ctx.fillRect(innerX, innerY, innerW, innerH);

                    // Felt surface
                    const feltX = offsetX - this.width / 2 * scale;
                    const feltY = offsetY - this.height / 2 * scale;
                    const feltW = this.width * scale;
                    const feltH = this.height * scale;
                    const feltGrad = ctx.createRadialGradient(offsetX, offsetY, feltW * 0.1, offsetX, offsetY, feltW * 0.9);
                    feltGrad.addColorStop(0, this.getFeltColor());
                    feltGrad.addColorStop(1, this.getFeltDark());
                    ctx.fillStyle = feltGrad;
                    ctx.fillRect(feltX, feltY, feltW, feltH);

                    // Felt texture lines (subtle)
                    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                    ctx.lineWidth = 1;
                    for (let i = feltX; i < feltX + feltW; i += 12 * scale) {
                        ctx.beginPath();
                        ctx.moveTo(i, feltY);
                        ctx.lineTo(i, feltY + feltH);
                        ctx.stroke();
                    }

                    // Head string line
                    const headStringX = offsetX - this.width * 0.25 * scale;
                    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([6 * scale, 8 * scale]);
                    ctx.beginPath();
                    ctx.moveTo(headStringX, feltY);
                    ctx.lineTo(headStringX, feltY + feltH);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Foot spot
                    const footSpotX = offsetX + this.width * 0.25 * scale;
                    const footSpotY = offsetY;
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.arc(footSpotX, footSpotY, 3 * scale, 0, Math.PI * 2);
                    ctx.fill();

                    // Pockets
                    for (const pocket of this.pockets) {
                        const px = pocket.pos.x * scale + offsetX;
                        const py = pocket.pos.y * scale + offsetY;
                        const pr = pocket.radius * scale;
                        const pGrad = ctx.createRadialGradient(px, py, pr * 0.3, px, py, pr);
                        pGrad.addColorStop(0, '#000');
                        pGrad.addColorStop(0.7, '#111');
                        pGrad.addColorStop(1, '#1a1a1a');
                        ctx.fillStyle = pGrad;
                        ctx.beginPath();
                        ctx.arc(px, py, pr, 0, Math.PI * 2);
                        ctx.fill();
                        // Pocket rim
                        ctx.strokeStyle = '#3a2010';
                        ctx.lineWidth = 2.5 * scale;
                        ctx.beginPath();
                        ctx.arc(px, py, pr + 1 * scale, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Rail dots (diamonds)
                    const dotSpacing = this.width / 8;
                    ctx.fillStyle = 'rgba(255,220,180,0.6)';
                    for (let i = 1; i < 8; i++) {
                        const dx = (-this.width / 2 + dotSpacing * i) * scale + offsetX;
                        const dyTop = (-this.height / 2 - this.railWidth * 0.6) * scale + offsetY;
                        const dyBot = (this.height / 2 + this.railWidth * 0.6) * scale + offsetY;
                        ctx.beginPath();
                        ctx.arc(dx, dyTop, 3.5 * scale, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(dx, dyBot, 3.5 * scale, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    const dotSpacingY = this.height / 4;
                    for (let i = 1; i < 4; i++) {
                        const dy = (-this.height / 2 + dotSpacingY * i) * scale + offsetY;
                        const dxL = (-this.width / 2 - this.railWidth * 0.6) * scale + offsetX;
                        const dxR = (this.width / 2 + this.railWidth * 0.6) * scale + offsetX;
                        ctx.beginPath();
                        ctx.arc(dxL, dy, 3.5 * scale, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(dxR, dy, 3.5 * scale, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // --- Cue Stick ---
            class Cue {
                constructor() {
                    this.angle = 0;
                    this.power = 0;
                    this.maxPower = MAX_POWER;
                    this.visible = true;
                    this.pullback = 0;
                    this.animating = false;
                    this.animProgress = 0;
                    this.animDuration = 0.15;
                    this.strikePos = null;
                }

                draw(ctx, scale, offsetX, offsetY, cueBallPos) {
                    if (!this.visible || !cueBallPos) return;
                    const sx = cueBallPos.x * scale + offsetX;
                    const sy = cueBallPos.y * scale + offsetY;
                    const pullDist = this.pullback * scale;
                    const totalDist = (BALL_RADIUS + 8) * scale + pullDist;

                    const startX = sx - Math.cos(this.angle) * totalDist;
                    const startY = sy - Math.sin(this.angle) * totalDist;
                    const endX = sx - Math.cos(this.angle) * (BALL_RADIUS + 3) * scale;
                    const endY = sy - Math.sin(this.angle) * (BALL_RADIUS + 3) * scale;

                    // Cue shadow
                    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                    ctx.lineWidth = 7 * scale;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(startX + 2, startY + 2);
                    ctx.lineTo(endX + 2, endY + 2);
                    ctx.stroke();

                    // Cue body (tapered)
                    const tipWidth = 3.5 * scale;
                    const buttWidth = 8 * scale;
                    const len = totalDist;
                    const segments = 20;
                    for (let i = 0; i < segments; i++) {
                        const t = i / segments;
                        const tNext = (i + 1) / segments;
                        const w = tipWidth + (buttWidth - tipWidth) * t;
                        const wNext = tipWidth + (buttWidth - tipWidth) * tNext;
                        const x1 = startX + (endX - startX) * t;
                        const y1 = startY + (endY - startY) * t;
                        const x2 = startX + (endX - startX) * tNext;
                        const y2 = startY + (endY - startY) * tNext;
                        const shade = 0.55 + t * 0.45;
                        ctx.fillStyle =
                            `rgb(${Math.floor(180*shade)},${Math.floor(140*shade)},${Math.floor(90*shade)})`;
                        ctx.beginPath();
                        ctx.moveTo(x1 - w / 2, y1);
                        ctx.lineTo(x1 + w / 2, y1);
                        ctx.lineTo(x2 + wNext / 2, y2);
                        ctx.lineTo(x2 - wNext / 2, y2);
                        ctx.closePath();
                        ctx.fill();
                    }

                    // Ferrule (white tip area)
                    const ferruleX = endX;
                    const ferruleY = endY;
                    const ferruleLen = 12 * scale;
                    const ferruleStartX = ferruleX - Math.cos(this.angle) * ferruleLen;
                    const ferruleStartY = ferruleY - Math.sin(this.angle) * ferruleLen;
                    ctx.strokeStyle = '#f0ece0';
                    ctx.lineWidth = 4 * scale;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(ferruleStartX, ferruleStartY);
                    ctx.lineTo(ferruleX, ferruleY);
                    ctx.stroke();

                    // Tip
                    ctx.fillStyle = '#3a8ad4';
                    ctx.beginPath();
                    ctx.arc(ferruleX, ferruleY, 3.2 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // --- Physics Engine ---
            class PhysicsEngine {
                constructor(table, audioManager, particleSystem) {
                    this.table = table;
                    this.audio = audioManager;
                    this.particles = particleSystem;
                }

                checkPocket(ball) {
                    if (ball.pocketed) return false;
                    for (const pocket of this.table.pockets) {
                        const dist = ball.pos.dist(pocket.pos);
                        if (dist < pocket.radius - ball.radius * 0.3) {
                            ball.pocketed = true;
                            ball.vel.set(0, 0);
                            this.particles.emit(ball.pos.x, ball.pos.y, 25, 'rgb(255,220,150)',
                                4, 0.6, 4);
                            this.audio.pocketSound();
                            return true;
                        }
                        // Pocket pull (if close to pocket, slightly pull ball in)
                        if (dist < pocket.radius + POCKET_PULL_DIST && ball.vel.length() < 3) {
                            const pullDir = pocket.pos.clone().sub(ball.pos).normalize();
                            const pullForce = (1 - dist / (pocket.radius + POCKET_PULL_DIST)) * 0.8;
                            ball.vel.add(pullDir.clone().scale(pullForce));
                        }
                    }
                    return false;
                }

                checkCushions(ball) {
                    if (ball.pocketed) return;
                    const hw = this.table.width / 2;
                    const hh = this.table.height / 2;
                    const r = ball.radius;
                    let collided = false;

                    // Check each cushion segment
                    for (const seg of this.table.cushionSegments) {
                        const closest = this._closestPointOnSegment(ball.pos, seg.start, seg.end);
                        const dist = ball.pos.dist(closest);
                        if (dist < r) {
                            // Push ball out
                            const pushDir = ball.pos.clone().sub(closest).normalize();
                            if (pushDir.length() < 0.001) pushDir.copy(seg.normal);
                            ball.pos.copy(closest.clone().add(pushDir.clone().scale(r + 0.5)));
                            // Reflect velocity
                            const dot = ball.vel.dot(pushDir);
                            if (dot < 0) {
                                ball.vel.sub(pushDir.clone().scale(2 * dot));
                                ball.vel.scale(CUSHION_RESTITUTION);
                                collided = true;
                            }
                        }
                    }

                    // Also check corners near pockets
                    for (const pocket of this.table.pockets) {
                        const dist = ball.pos.dist(pocket.pos);
                        const safeDist = pocket.radius + r * 0.7;
                        if (dist < safeDist && dist > pocket.radius - r * 0.5) {
                            const pushDir = ball.pos.clone().sub(pocket.pos).normalize();
                            if (pushDir.length() > 0.001) {
                                ball.pos.copy(pocket.pos.clone().add(pushDir.clone().scale(safeDist)));
                                const dot = ball.vel.dot(pushDir);
                                if (dot < 0) {
                                    ball.vel.sub(pushDir.clone().scale(2 * dot));
                                    ball.vel.scale(CUSHION_RESTITUTION * 0.8);
                                    collided = true;
                                }
                            }
                        }
                    }

                    if (collided) {
                        this.audio.cushionBounce();
                        this.particles.emit(ball.pos.x, ball.pos.y, 6, 'rgb(200,180,150)', 1.5, 0.3, 2);
                    }
                }

                ballCollision(b1, b2) {
                    if (b1.pocketed || b2.pocketed) return;
                    const dist = b1.pos.dist(b2.pos);
                    const minDist = b1.radius + b2.radius;
                    if (dist < minDist && dist > 0.001) {
                        // Separate balls
                        const overlap = minDist - dist;
                        const sepDir = b1.pos.clone().sub(b2.pos).normalize();
                        if (sepDir.length() < 0.001) sepDir.set(1, 0);
                        b1.pos.add(sepDir.clone().scale(overlap / 2));
                        b2.pos.sub(sepDir.clone().scale(overlap / 2));

                        // Elastic collision
                        const relVel = b1.vel.clone().sub(b2.vel);
                        const contactNormal = b1.pos.clone().sub(b2.pos).normalize();
                        const relVelDot = relVel.dot(contactNormal);
                        if (relVelDot > 0) return; // Already separating

                        const impulse = contactNormal.clone().scale(relVelDot * BALL_RESTITUTION);
                        b1.vel.sub(impulse);
                        b2.vel.add(impulse);

                        // Spin influence
                        if (b1.spin !== 0) {
                            const tangent = new Vec2(-contactNormal.y, contactNormal.x);
                            b1.vel.add(tangent.scale(b1.spin * 0.3));
                        }

                        const collisionForce = Math.abs(relVelDot);
                        this.audio.ballHit(collisionForce);
                        const midX = (b1.pos.x + b2.pos.x) / 2;
                        const midY = (b1.pos.y + b2.pos.y) / 2;
                        this.particles.emit(midX, midY, Math.floor(collisionForce * 3), 'rgb(255,240,220)',
                            collisionForce * 0.5, 0.25, 3);
                    }
                }

                _closestPointOnSegment(point, segStart, segEnd) {
                    const ab = segEnd.clone().sub(segStart);
                    const ap = point.clone().sub(segStart);
                    const lenSq = ab.lengthSq();
                    if (lenSq < 0.0001) return segStart.clone();
                    let t = ap.dot(ab) / lenSq;
                    t = Math.max(0, Math.min(1, t));
                    return segStart.clone().add(ab.clone().scale(t));
                }

                update(balls, dt) {
                    // Sub-step for stability
                    const subSteps = 3;
                    const subDt = dt / subSteps;
                    for (let s = 0; s < subSteps; s++) {
                        for (const ball of balls) {
                            if (!ball.pocketed) {
                                ball.update(subDt);
                                this.checkCushions(ball);
                                this.checkPocket(ball);
                            }
                        }
                        // Ball-to-ball collisions
                        for (let i = 0; i < balls.length; i++) {
                            for (let j = i + 1; j < balls.length; j++) {
                                this.ballCollision(balls[i], balls[j]);
                            }
                        }
                    }
                }

                allBallsStopped(balls) {
                    for (const ball of balls) {
                        if (!ball.pocketed && ball.vel.length() > 0.06) return false;
                    }
                    return true;
                }
            }

            // --- Game Manager ---
            class GameManager {
                constructor(audioManager) {
                    this.audio = audioManager;
                    this.balls = [];
                    this.cueBall = null;
                    this.table = new Table();
                    this.particles = new ParticleSystem();
                    this.physics = new PhysicsEngine(this.table, this.audio, this.particles);
                    this.cue = new Cue();
                    this.gameMode = 'practice'; // 'practice', 'pvp', 'ai'
                    this.aiDifficulty = 'medium';
                    this.currentPlayer = 1; // 1 or 2
                    this.player1Type = 'solid'; // assigned after first pocket
                    this.player2Type = 'stripe';
                    this.assigned = false;
                    this.gameOver = false;
                    this.winner = null;
                    this.paused = false;
                    this.aiming = false;
                    this.aimStart = null;
                    this.shotInProgress = false;
                    this.firstContact = null;
                    this.pocketedThisShot = [];
                    this.foulThisShot = false;
                    this.turnMessage = '';
                    this.showGuide = true;
                    this.soundEnabled = true;
                    this.musicEnabled = false;
                    this.scores = { 1: 0, 2: 0 };
                    this.foulMessage = '';
                    this.foulMessageTimer = 0;
                    this.cameraShake = 0;
                    this.cameraShakeX = 0;
                    this.cameraShakeY = 0;
                    this.winCelebration = 0;
                }

                setupRack() {
                    this.balls = [];
                    this.particles.clear();
                    this.assigned = false;
                    this.gameOver = false;
                    this.winner = null;
                    this.shotInProgress = false;
                    this.pocketedThisShot = [];
                    this.foulThisShot = false;
                    this.firstContact = null;
                    this.foulMessage = '';
                    this.foulMessageTimer = 0;
                    this.cameraShake = 0;
                    this.winCelebration = 0;
                    this.scores = { 1: 0, 2: 0 };

                    const hw = this.table.width / 2;
                    const hh = this.table.height / 2;
                    const footSpotX = hw * 0.5;
                    const footSpotY = 0;

                    // Cue ball behind head string
                    this.cueBall = new Ball(-hw * 0.5, 0, 0, true);
                    this.balls.push(this.cueBall);

                    // Standard 8-ball rack (triangle pointing toward head of table)
                    const rackStartX = footSpotX;
                    const rackStartY = footSpotY;
                    const spacing = BALL_RADIUS * 2 + 0.8;

                    // Ball arrangement in triangle (rows 1-5 from top)
                    const rackBalls = [
                        { row: 0, col: 0, num: 1 }, // apex (solid)
                        { row: 1, col: 0, num: 9 }, { row: 1, col: 1, num: 2 },
                        { row: 2, col: 0, num: 3 }, { row: 2, col: 1, num: 8 }, { row: 2, col: 2, num: 10 },
                        { row: 3, col: 0, num: 11 }, { row: 3, col: 1, num: 4 }, { row: 3, col: 2, num: 12 }, { row: 3,
                            col: 3, num: 5 },
                        { row: 4, col: 0, num: 13 }, { row: 4, col: 1, num: 6 }, { row: 4, col: 2, num: 14 }, { row: 4,
                            col: 3, num: 7 }, { row: 4, col: 4, num: 15 },
                    ];

                    for (const rb of rackBalls) {
                        const x = rackStartX + rb.row * spacing * Math.cos(Math.PI / 6);
                        const y = rackStartY + (rb.col - rb.row / 2) * spacing;
                        this.balls.push(new Ball(x, y, rb.num));
                    }

                    this.currentPlayer = 1;
                    this.cue.visible = true;
                    this.cue.angle = Math.PI; // Aim toward the rack
                    this.cue.power = 0;
                    this.cue.pullback = 0;
                }

                getPlayerBalls(player) {
                    const type = player === 1 ? this.player1Type : this.player2Type;
                    return this.balls.filter(b => !b.pocketed && !b.isCue && !b.isEight &&
                        ((type === 'solid' && b.isSolid) || (type === 'stripe' && b.isStripe)));
                }

                getOpponentBalls(player) {
                    const type = player === 1 ? this.player2Type : this.player1Type;
                    return this.balls.filter(b => !b.pocketed && !b.isCue && !b.isEight &&
                        ((type === 'solid' && b.isSolid) || (type === 'stripe' && b.isStripe)));
                }

                allPlayerBallsPocketed(player) {
                    return this.getPlayerBalls(player).length === 0;
                }

                isEightBallOnTable() {
                    return this.balls.some(b => b.number === 8 && !b.pocketed);
                }

                getPocketedEight() {
                    return this.balls.find(b => b.number === 8 && b.pocketed);
                }

                handleShotResult() {
                    const pocketedSolids = this.pocketedThisShot.filter(b => b.isSolid);
                    const pocketedStripes = this.pocketedThisShot.filter(b => b.isStripe);
                    const pocketedEight = this.pocketedThisShot.find(b => b.isEight);
                    const pocketedCue = this.pocketedThisShot.find(b => b.isCue);

                    let foul = this.foulThisShot;
                    let turnSwitch = false;

                    // Scratch (cue ball pocketed)
                    if (pocketedCue) {
                        foul = true;
                        this.foulMessage = 'Scratch! Ball in hand.';
                        this.foulMessageTimer = 2;
                        this.audio.foulSound();
                        // Reposition cue ball
                        this.cueBall.pocketed = false;
                        this.cueBall.pos.set(-this.table.width * 0.35, (Math.random() - 0.5) * this.table.height *
                        0.6);
                        this.cueBall.vel.set(0, 0);
                        turnSwitch = true;
                    }

                    // 8-ball pocketed
                    if (pocketedEight) {
                        if (!this.assigned) {
                            // 8-ball on break - re-rack or spot it (here we just reset)
                            pocketedEight.pocketed = false;
                            pocketedEight.pos.set(this.table.width * 0.5, 0);
                            pocketedEight.vel.set(0, 0);
                            this.foulMessage = '8-ball pocketed on break - respotted';
                            this.foulMessageTimer = 2;
                            turnSwitch = true;
                        } else if (this.allPlayerBallsPocketed(this.currentPlayer) && !foul) {
                            // Legal 8-ball pocket - WIN!
                            this.gameOver = true;
                            this.winner = this.currentPlayer;
                            this.audio.victorySound();
                            this.winCelebration = 3;
                            this.cue.visible = false;
                            return;
                        } else {
                            // 8-ball pocketed illegally - LOSE
                            this.gameOver = true;
                            this.winner = this.currentPlayer === 1 ? 2 : 1;
                            this.foulMessage = '8-ball pocketed illegally!';
                            this.foulMessageTimer = 3;
                            this.audio.foulSound();
                            this.cue.visible = false;
                            return;
                        }
                    }

                    // Ball assignment
                    if (!this.assigned && (pocketedSolids.length > 0 || pocketedStripes.length > 0) && !foul) {
                        if (pocketedSolids.length > 0 && pocketedStripes.length === 0) {
                            this.player1Type = 'solid';
                            this.player2Type = 'stripe';
                            this.assigned = true;
                        } else if (pocketedStripes.length > 0 && pocketedSolids.length === 0) {
                            this.player1Type = 'stripe';
                            this.player2Type = 'solid';
                            this.assigned = true;
                        }
                        // If both types pocketed on break, shooter chooses (we auto-assign based on first pocketed)
                        if (pocketedSolids.length > 0 && pocketedStripes.length > 0) {
                            this.player1Type = pocketedSolids.length >= pocketedStripes.length ? 'solid' : 'stripe';
                            this.player2Type = this.player1Type === 'solid' ? 'stripe' : 'solid';
                            this.assigned = true;
                        }
                    }

                    // Update scores
                    if (this.assigned) {
                        const p1Balls = this.balls.filter(b => b.isSolid && b.pocketed).length;
                        const p2Balls = this.balls.filter(b => b.isStripe && b.pocketed).length;
                        if (this.player1Type === 'solid') {
                            this.scores[1] = p1Balls;
                            this.scores[2] = p2Balls;
                        } else {
                            this.scores[1] = p2Balls;
                            this.scores[2] = p1Balls;
                        }
                    }

                    // Determine if turn switches
                    const playerPocketedOwn = this.pocketedThisShot.some(b => {
                        const t = this.currentPlayer === 1 ? this.player1Type : this.player2Type;
                        return (t === 'solid' && b.isSolid) || (t === 'stripe' && b.isStripe);
                    });

                    if (foul || (!playerPocketedOwn && this.pocketedThisShot.length === 0) || (this.pocketedThisShot
                            .length === 0 && !foul && this.firstContact === null)) {
                        turnSwitch = true;
                    }
                    if (foul || (!playerPocketedOwn && !foul && this.pocketedThisShot.length > 0 && this.assigned)) {
                        turnSwitch = true;
                    }
                    if (!this.assigned && !foul && this.pocketedThisShot.length > 0) {
                        turnSwitch = false; // Shooter continues after break pocket
                    }
                    if (foul && this.pocketedThisShot.length === 0 && !pocketedCue) {
                        turnSwitch = true;
                    }

                    if (turnSwitch && !this.gameOver) {
                        this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
                    }

                    // Reset shot tracking
                    this.pocketedThisShot = [];
                    this.foulThisShot = false;
                    this.firstContact = null;
                    this.cue.visible = true;
                    this.cue.power = 0;
                    this.cue.pullback = 0;
                }

                executeShot(power, angle) {
                    if (this.shotInProgress || this.gameOver) return;
                    this.shotInProgress = true;
                    this.pocketedThisShot = [];
                    this.foulThisShot = false;
                    this.firstContact = null;
                    this.cue.visible = false;

                    const shotVec = Vec2.fromAngle(angle).scale(power);
                    this.cueBall.vel.copy(shotVec);
                    this.cueBall.spin = 0; // Reset spin

                    this.audio.cueStrike(power);
                    this.cameraShake = power / MAX_POWER * 3;
                    this.particles.emit(this.cueBall.pos.x, this.cueBall.pos.y, 8, 'rgb(255,255,240)', power * 0.4, 0.2, 2);

                    // Animate cue strike
                    this.cue.animating = true;
                    this.cue.animProgress = 0;
                    this.cue.strikePos = this.cueBall.pos.clone();
                }

                update(dt) {
                    if (this.paused || this.gameOver) {
                        // Still update particles
                        this.particles.update(dt);
                        if (this.winCelebration > 0) this.winCelebration -= dt;
                        if (this.foulMessageTimer > 0) this.foulMessageTimer -= dt;
                        return;
                    }

                    // Update physics
                    this.physics.update(this.balls, dt);
                    this.particles.update(dt);

                    // Camera shake decay
                    if (this.cameraShake > 0.01) {
                        this.cameraShake *= 0.9;
                        this.cameraShakeX = (Math.random() - 0.5) * this.cameraShake * 8;
                        this.cameraShakeY = (Math.random() - 0.5) * this.cameraShake * 8;
                    } else {
                        this.cameraShake = 0;
                        this.cameraShakeX = 0;
                        this.cameraShakeY = 0;
                    }

                    // Foul message timer
                    if (this.foulMessageTimer > 0) this.foulMessageTimer -= dt;

                    // Cue animation
                    if (this.cue.animating) {
                        this.cue.animProgress += dt;
                        if (this.cue.animProgress >= this.cue.animDuration) {
                            this.cue.animating = false;
                            this.cue.animProgress = 0;
                        }
                    }

                    // Track first contact during shot
                    if (this.shotInProgress && !this.firstContact) {
                        for (const ball of this.balls) {
                            if (ball === this.cueBall || ball.pocketed) continue;
                            const dist = this.cueBall.pos.dist(ball.pos);
                            if (dist < BALL_RADIUS * 2 + 1 && this.cueBall.vel.length() > 0.5) {
                                this.firstContact = ball;
                                break;
                            }
                        }
                    }

                    // Track pocketed balls during shot
                    if (this.shotInProgress) {
                        for (const ball of this.balls) {
                            if (ball.pocketed && !this.pocketedThisShot.includes(ball) && ball !== this.cueBall) {
                                this.pocketedThisShot.push(ball);
                            }
                        }
                        // Check first contact legality
                        if (this.firstContact && this.assigned) {
                            const playerType = this.currentPlayer === 1 ? this.player1Type : this.player2Type;
                            const isOwnBall = (playerType === 'solid' && this.firstContact.isSolid) ||
                                (playerType === 'stripe' && this.firstContact.isStripe);
                            if (!isOwnBall && !this.firstContact.isEight) {
                                this.foulThisShot = true;
                            }
                            if (this.firstContact.isEight && !this.allPlayerBallsPocketed(this.currentPlayer)) {
                                this.foulThisShot = true;
                            }
                        }
                    }

                    // Check if shot is complete
                    if (this.shotInProgress && this.physics.allBallsStopped(this.balls)) {
                        this.shotInProgress = false;
                        // Check if any ball was pocketed this shot (for cue ball scratch tracking)
                        if (this.cueBall.pocketed && !this.pocketedThisShot.includes(this.cueBall)) {
                            this.pocketedThisShot.push(this.cueBall);
                        }
                        this.handleShotResult();
                    }

                    if (this.winCelebration > 0) this.winCelebration -= dt;
                }

                respotCueBall() {
                    if (this.shotInProgress) return;
                    this.cueBall.pocketed = false;
                    this.cueBall.vel.set(0, 0);
                    // Place behind head string
                    const hw = this.table.width / 2;
                    const hh = this.table.height / 2;
                    this.cueBall.pos.set(-hw * 0.4, (Math.random() - 0.5) * hh * 0.7);
                    // Ensure not overlapping
                    for (const ball of this.balls) {
                        if (ball === this.cueBall || ball.pocketed) continue;
                        if (this.cueBall.pos.dist(ball.pos) < BALL_RADIUS * 2 + 1) {
                            this.cueBall.pos.y += BALL_RADIUS * 3;
                        }
                    }
                }
            }

            // --- AI Player ---
            class AIPlayer {
                constructor(gameManager) {
                    this.gm = gameManager;
                    this.difficulty = 'medium';
                    this.thinking = false;
                    this.thinkTimer = 0;
                    this.targetAngle = 0;
                    this.targetPower = 0;
                    this.shotReady = false;
                }

                getAccuracy() {
                    if (this.difficulty === 'easy') return 0.35 + Math.random() * 0.4;
                    if (this.difficulty === 'medium') return 0.6 + Math.random() * 0.3;
                    return 0.8 + Math.random() * 0.2; // hard
                }

                getPowerVariation() {
                    if (this.difficulty === 'easy') return 0.4 + Math.random() * 0.5;
                    if (this.difficulty === 'medium') return 0.6 + Math.random() * 0.35;
                    return 0.75 + Math.random() * 0.25;
                }

                planShot() {
                    if (this.gm.shotInProgress || this.gm.gameOver) {
                        this.shotReady = false;
                        return;
                    }
                    this.thinking = true;
                    this.thinkTimer = 0.6 + Math.random() * 0.8;
                    this.shotReady = false;

                    const playerType = this.gm.currentPlayer === 1 ? this.gm.player1Type : this.gm.player2Type;
                    const targetBalls = this.gm.balls.filter(b => !b.pocketed && !b.isCue && !b.isEight &&
                        ((playerType === 'solid' && b.isSolid) || (playerType === 'stripe' && b.isStripe)));
                    const eightBall = this.gm.balls.find(b => b.number === 8 && !b.pocketed);

                    // If all player balls pocketed, target 8-ball
                    const targets = targetBalls.length > 0 ? targetBalls : (eightBall ? [eightBall] : []);

                    if (targets.length === 0) {
                        // No targets - just hit something
                        const anyBall = this.gm.balls.find(b => !b.pocketed && !b.isCue);
                        if (anyBall) {
                            const toTarget = anyBall.pos.clone().sub(this.gm.cueBall.pos);
                            this.targetAngle = toTarget.angle();
                            this.targetPower = 8 + Math.random() * 8;
                        }
                    } else {
                        // Find best target (closest to a pocket, or easiest angle)
                        let bestTarget = targets[0];
                        let bestScore = -Infinity;
                        for (const target of targets) {
                            let minPocketDist = Infinity;
                            for (const pocket of this.gm.table.pockets) {
                                const dist = target.pos.dist(pocket.pos);
                                if (dist < minPocketDist) minPocketDist = dist;
                            }
                            const distToCue = this.gm.cueBall.pos.dist(target.pos);
                            const score = -minPocketDist * 2 - distToCue * 0.3 + (Math.random() - 0.5) * 50;
                            if (score > bestScore) {
                                bestScore = score;
                                bestTarget = target;
                            }
                        }

                        // Aim at best target, with offset to pocket it
                        const toTarget = bestTarget.pos.clone().sub(this.gm.cueBall.pos);
                        let aimAngle = toTarget.angle();

                        // Find nearest pocket to target and adjust aim
                        let nearestPocket = this.gm.table.pockets[0];
                        let minDist = bestTarget.pos.dist(nearestPocket.pos);
                        for (const pocket of this.gm.table.pockets) {
                            const d = bestTarget.pos.dist(pocket.pos);
                            if (d < minDist) { minDist = d;
                                nearestPocket = pocket; }
                        }

                        // Aim to hit the target toward the pocket
                        const pocketDir = nearestPocket.pos.clone().sub(bestTarget.pos).normalize();
                        const ghostBallPos = bestTarget.pos.clone().sub(pocketDir.clone().scale(BALL_RADIUS * 2));
                        const toGhost = ghostBallPos.sub(this.gm.cueBall.pos);
                        aimAngle = toGhost.angle();

                        // Add inaccuracy
                        const accuracy = this.getAccuracy();
                        aimAngle += (Math.random() - 0.5) * (1 - accuracy) * 0.6;

                        this.targetAngle = aimAngle;
                        const distFactor = Math.min(1, toTarget.length() / 300);
                        this.targetPower = (5 + distFactor * 14) * this.getPowerVariation();
                        this.targetPower = Math.min(MAX_POWER, Math.max(MIN_POWER, this.targetPower));
                    }
                }

                update(dt) {
                    if (!this.thinking) return;
                    this.thinkTimer -= dt;
                    if (this.thinkTimer <= 0) {
                        this.thinking = false;
                        this.shotReady = true;
                    }
                }

                getAim() {
                    return { angle: this.targetAngle, power: this.targetPower, ready: this.shotReady };
                }

                reset() {
                    this.thinking = false;
                    this.shotReady = false;
                    this.thinkTimer = 0;
                }
            }

            // --- Main Game ---
            class PoolGame {
                constructor() {
                    this.audio = new AudioManager();
                    this.gm = new GameManager(this.audio);
                    this.ai = new AIPlayer(this.gm);
                    this.canvas = canvas;
                    this.ctx = ctx;
                    this.scale = 1;
                    this.offsetX = 0;
                    this.offsetY = 0;
                    this.lastTime = performance.now();
                    this.mousePos = new Vec2();
                    this.isDragging = false;
                    this.dragStart = null;
                    this.dragCurrent = null;
                    this.gameMode = 'practice';
                    this.showPowerBar = true;

                    this.setupCanvas();
                    this.bindEvents();
                    this.gm.setupRack();
                    this.showMenu('mainMenu');
                    this.loop(performance.now());
                }

                setupCanvas() {
                    const resize = () => {
                        const containerW = container.clientWidth;
                        const containerH = container.clientHeight;
                        const tableAspect = (TABLE_WIDTH + RAIL_WIDTH * 2) / (TABLE_HEIGHT + RAIL_WIDTH * 2);
                        const containerAspect = containerW / containerH;
                        let w, h;
                        if (containerAspect > tableAspect) {
                            h = containerH * 0.92;
                            w = h * tableAspect;
                        } else {
                            w = containerW * 0.92;
                            h = w / tableAspect;
                        }
                        this.canvas.width = w;
                        this.canvas.height = h;
                        this.scale = w / (TABLE_WIDTH + RAIL_WIDTH * 2);
                        this.offsetX = w / 2;
                        this.offsetY = h / 2;
                    };
                    resize();
                    window.addEventListener('resize', resize);
                    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
                }

                bindEvents() {
                    // Mouse events
                    this.canvas.addEventListener('mousedown', (e) => this.onPointerDown(e));
                    this.canvas.addEventListener('mousemove', (e) => this.onPointerMove(e));
                    this.canvas.addEventListener('mouseup', (e) => this.onPointerUp(e));
                    this.canvas.addEventListener('mouseleave', () => this.onPointerUp(null));

                    // Touch events
                    this.canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.onPointerDown(e.touches[0]);
                    }, { passive: false });
                    this.canvas.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        this.onPointerMove(e.touches[0]);
                    }, { passive: false });
                    this.canvas.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        this.onPointerUp(null);
                    });
                    this.canvas.addEventListener('touchcancel', () => this.onPointerUp(null));
